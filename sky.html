<title>Небо над вами</title>
<!--
  ===== НЕБО НАД ВАМИ — ПРОТОТИП =====

  Карта звёздного неба в реальном времени: телефон наводят на небо и видят,
  где какие созвездия и планеты. Экран приложения «прогноз на день»
  (tools/natal-calc/app), открывается с экрана дня; системная «Назад»
  возвращает обратно.

  Откуда что берётся:
    • куда смотрит телефон — датчик ориентации (deviceorientationabsolute:
      компас + гироскоп + акселерометр). Нет компаса — небо водят пальцем;
      компас ошибается на 5–15° — горизонтальный свайп его подправляет;
    • где человек — GPS, запоминается в телефоне и никуда не уходит;
    • звёзды и созвездия — app/sky.json (d3-celestial, BSD-3), J2000;
    • планеты — Swiss Ephemeris в WebAssembly, тот же движок, что считает
      день (engine.js, сообщение {type:'sky'}), раз в минуту;
    • «ещё в космосе» — карликовые планеты, крупные астероиды, кометы,
      межзвёздный гость, действующие зонды — app/bodies.json: таблица
      положений JPL Horizons на два года (собирает src/build-bodies.ts),
      в телефоне — только интерполяция, в сеть за ними не ходим. Радианты
      метеорных потоков — справочник SHOWERS ниже, они ежегодные. Слой
      выключается кнопкой «Ещё в космосе» в нижнем ряду.

  Кометы рисуются с хвостом от Солнца; что не видно глазом, — тусклее и
  контуром. В карточке такого тела — чем его увидеть: глазом, в бинокль,
  в телескоп или никак (зонд).

  Знак и созвездие показываются оба и честно расходятся: знаки зодиака
  отсчитываются от точки весеннего равноденствия, а она из-за прецессии
  ползёт по небу на 1° за 72 года. Эклиптика с метками знаков — латунная
  линия, фигуры созвездий — под ней.

  Проекция — гномоническая (как у камеры): большие круги неба, в том
  числе горизонт и эклиптика, ложатся прямыми линиями. Поэтому земля под
  горизонтом — просто полуплоскость экрана.

  Прицел: планету держат в кольце по центру 3 секунды — кольцо заполняется,
  и открывается карточка: рисунок планеты, факт о ней, сколько до неё
  сейчас, знак и созвездие, дом в вашей карте. Тап по планете или по
  кнопке внизу открывает ту же карточку сразу. Градусов (высота, азимут)
  на экране нет — они сбивали; стороны света — словами.
-->
<style>
  /* ===== ПАЛИТРА ===== (как у экрана дня) */
  :root {
    --bg:          #1A2036;
    --bg-black:    #0B0E1C;
    --card-solid:  #232B47;
    --accent:      #C9A45C;
    --periwinkle:  #E0C48C;
    --text:        #F4F1E9;
    --text-dim:    rgba(244,241,233,0.78);
    --muted:       rgba(244,241,233,0.5);
    --border:      rgba(244,241,233,0.14);
    --modal-border: rgba(201,164,92,0.28);
    --chip-bg:     rgba(26,32,54,0.72);
    --font: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --glyph-font: 'Segoe UI Symbol','Apple Symbols','Noto Sans Symbols','Noto Sans Symbols 2','DejaVu Sans',sans-serif;

    /* небо на canvas: ночь, сумерки, земля, линии */
    --sky-night:   #070A16;
    --sky-zenith:  #0E1430;
    --sky-twilight:#2A3360;
    --ground:      rgba(20,16,12,0.82);
    --horizon:     rgba(224,196,140,0.55);
    --con-line:    rgba(160,180,230,0.28);
    --con-zodiac:  rgba(201,164,92,0.45);
    --con-label:   rgba(180,195,235,0.55);
    --ecliptic:    rgba(201,164,92,0.6);
    --star-0: #A9C4FF; --star-1: #D4E0FF; --star-2: #FFF8EE; --star-3: #FFE2B0; --star-4: #FFBE8A;
    --sun:         #FFD36B;
    --moon:        #E8E6DC;
    --planet:      #C9A45C;
    --target:      #E0C48C;
    /* «ещё в космосе»: свой цвет у каждого рода тел */
    --minor:       #C7BBA4;
    --comet:       #9FE3D0;
    --comet-tail:  rgba(159,227,208,0.45);
    --probe:       #8FB8FF;
    --meteor:      #F2A7C3;
    --guest:       #D9A8FF;

    /* рисунки планет в карточке: цвета по фотографиям, приглушённые */
    --pl-shade:        #05060C;
    --pl-sun-core:     #FFF0C2;
    --pl-sun:          #FFC34D;
    --pl-sun-edge:     #EE8F2A;
    --pl-moon:         #E8E6DC;
    --pl-moon-dark:    #2A2D38;
    --pl-moon-crater:  #B9B6AC;
    --pl-mercury:      #A9A39A;
    --pl-mercury-dark: #77716A;
    --pl-venus:        #EAD9A6;
    --pl-venus-band:   #CDB57D;
    --pl-mars:         #C5643B;
    --pl-mars-dark:    #8E4127;
    --pl-mars-cap:     #F2EDE4;
    --pl-jupiter:      #DCC3A0;
    --pl-jupiter-band: #B08560;
    --pl-jupiter-spot: #C0613B;
    --pl-saturn:       #E3CC93;
    --pl-saturn-band:  #C4A766;
    --pl-saturn-ring:  #D9C79A;
    --pl-uranus:       #A3DCE2;
    --pl-uranus-ring:  #CDEBEE;
    --pl-neptune:      #4F72D4;
    --pl-neptune-spot: #2C4290;
    --pl-pluto:        #C8AC8B;
    --pl-pluto-heart:  #EFE2CC;
    --pl-rock:         #9A8F7E;
    --pl-rock-dark:    #655D52;
    --pl-ice:          #DCEAF0;
    --pl-metal:        #C9CED8;
    --pl-panel:        #3D5A99;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--sky-night); color: var(--text); font-family: var(--font);
    -webkit-font-smoothing: antialiased; touch-action: none; user-select: none; -webkit-user-select: none; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ===== ВЕРХ: НАЗАД, НАЗВАНИЕ, РЕЖИМ ===== */
  .sky-top { position: fixed; top: 0; left: 0; right: 0; z-index: 2; display: flex; align-items: center; gap: 8px;
    padding: calc(8px + env(safe-area-inset-top)) 10px 8px; background: linear-gradient(180deg, var(--bg-black), transparent); }
  .sky-back { width: 44px; height: 44px; border: 0; border-radius: 12px; background: none; color: var(--accent); font-size: 28px; line-height: 1; cursor: pointer; }
  .sky-title { flex: 1; min-width: 0; }
  .sky-title b { display: block; font-size: 16px; }
  .sky-title small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sky-mode { min-height: 36px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--modal-border); background: var(--chip-bg);
    color: var(--periwinkle); font: inherit; font-size: 13px; cursor: pointer; }

  /* ===== ЦЕНТР: ПРИЦЕЛ И ЧТО ПЕРЕД ВАМИ ===== */
  /* прицел — кольцо; пока планета в нём, внешняя дуга заполняется по
     часовой стрелке за 3 секунды, как значок ожидания */
  .sky-aim { position: fixed; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; pointer-events: none; z-index: 1; overflow: visible; }
  .sky-aim circle { fill: none; }
  .sky-aim .aim-ring { stroke: var(--modal-border); stroke-width: 1.5; transition: stroke .2s; }
  .sky-aim .aim-track { stroke: transparent; stroke-width: 3; transition: stroke .2s; }
  .sky-aim .aim-fill { stroke: var(--accent); stroke-width: 3; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 30px 30px; }
  .sky-aim.locked .aim-ring { stroke: var(--accent); }
  .sky-aim.locked .aim-track { stroke: var(--border); }
  .sky-aim-text { position: fixed; left: 0; right: 0; top: calc(50% + 36px); text-align: center; font-size: 13px; color: var(--text-dim);
    pointer-events: none; z-index: 1; text-shadow: 0 1px 4px var(--bg-black); padding: 0 24px; }

  /* ===== ПОДСКАЗКА ===== */
  .sky-hint { position: fixed; left: 12px; right: 12px; top: calc(68px + env(safe-area-inset-top)); z-index: 2; font-size: 13px; color: var(--text-dim);
    background: var(--chip-bg); border: 1px solid var(--border); border-radius: 12px; padding: 9px 12px; transition: opacity .4s; }
  .sky-hint:empty, .sky-hint.gone { opacity: 0; pointer-events: none; }

  /* ===== НИЗ: ПЛАНЕТЫ ===== */
  .sky-bodies { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
    padding: 10px 10px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(0deg, var(--bg-black), transparent); touch-action: pan-x; }
  .sky-bodies::-webkit-scrollbar { display: none; }
  .sky-chip { flex: 0 0 auto; min-height: 40px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--chip-bg);
    color: var(--text-dim); font: inherit; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .sky-chip i { font-style: normal; font-family: var(--glyph-font); color: var(--accent); font-size: 15px; }
  .sky-chip.on { border-color: var(--accent); color: var(--text); }
  .sky-chip.below { opacity: .55; }
  /* переключатель слоя «ещё в космосе» — пунктиром, чтобы не путать с телом */
  .sky-chip.layer { border-style: dashed; color: var(--muted); }
  .sky-chip.layer[aria-pressed="true"] { border-color: var(--modal-border); color: var(--periwinkle); }

  /* ===== КАРТОЧКА ПЛАНЕТЫ ===== */
  .sky-card { position: fixed; left: 10px; right: 10px; bottom: calc(66px + env(safe-area-inset-bottom)); z-index: 3; max-width: 460px; margin: 0 auto;
    /* на невысоких экранах 58% обрезали карточку посередине — даём ей место до шапки */
    max-height: max(58vh, calc(100vh - 230px)); overflow-y: auto; overscroll-behavior: contain;
    background: var(--card-solid); border: 1px solid var(--modal-border); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 7px;
    animation: pop .2s ease; touch-action: pan-y; }
  .sky-card[hidden] { display: none; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .sky-card-head { display: flex; align-items: center; gap: 12px; }
  .sky-pic { flex: 0 0 76px; width: 76px; height: 76px; }
  .sky-pic svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .sky-card-title { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .sky-card-title b { font-size: 18px; }
  .sky-card-title small { font-size: 13px; color: var(--text-dim); }
  .sky-card-title i { font-style: normal; font-family: var(--glyph-font); color: var(--accent); }
  .sky-fact { font-size: 14px; color: var(--text); line-height: 1.45; }
  .sky-astro { font-size: 13.5px; color: var(--periwinkle); line-height: 1.45; }
  .sky-card-x { width: 40px; height: 40px; border: 0; border-radius: 10px; background: none; color: var(--muted); font-size: 22px; cursor: pointer; }
  .sky-row { font-size: 14px; color: var(--text-dim); }
  .sky-row b { color: var(--text); font-weight: 600; }
  .sky-note { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .sky-today { font-size: 13.5px; color: var(--text-dim); padding-left: 12px; border-left: 2px solid var(--modal-border); }
  @media (prefers-reduced-motion: reduce) { .sky-card { animation: none; } }
</style>
</head>
<body>
<canvas id="sky" aria-label="Карта звёздного неба"></canvas>

<header class="sky-top">
  <button class="sky-back" id="back" type="button" aria-label="Назад">‹</button>

  const KIND_FACT = {

  /* Метеорные потоки: радиант на пик (J2000), даты активности, ZHR —

  const SHOWERS = [
    { id: 'qua', ru: 'Квадрантиды', ra: 230, dec: 49,  from: [12, 28], to: [1, 12],  peak: [1, 3],   zhr: 110, parent: 'астероида 2003 EH1 — вероятно, погасшей кометы' },

    { id: 'eta', ru: 'Эта-Аквариды', ra: 338, dec: -1, from: [4, 19],  to: [5, 28],  peak: [5, 6],   zhr: 50,  parent: 'кометы Галлея' },
    { id: 'sda', ru: 'Южные дельта-Аквариды', ra: 340, dec: -16, from: [7, 12], to: [8, 23], peak: [7, 30], zhr: 25, parent: 'вероятно, кометы Махгольца (96P)' },
    { id: 'per', ru: 'Персеиды',    ra: 48,  dec: 58,  from: [7, 17],  to: [8, 24],  peak: [8, 12],  zhr: 100, parent: 'кометы Свифта — Таттла (109P)' },
    { id: 'dra', ru: 'Дракониды',   ra: 262, dec: 54,  from: [10, 6],  to: [10, 10], peak: [10, 8],  zhr: 10,  parent: 'кометы Джакобини — Циннера (21P)' },
    { id: 'sta', ru: 'Южные Тауриды', ra: 32, dec: 9,  from: [9, 10],  to: [11, 20], peak: [10, 10], zhr: 5,   parent: 'кометы Энке (2P)' },
    { id: 'ori', ru: 'Ориониды',    ra: 95,  dec: 16,  from: [10, 2],  to: [11, 7],  peak: [10, 21], zhr: 20,  parent: 'кометы Галлея' },
    { id: 'nta', ru: 'Северные Тауриды', ra: 58, dec: 22, from: [10, 20], to: [12, 10], peak: [11, 12], zhr: 5, parent: 'кометы Энке (2P)' },
    { id: 'leo', ru: 'Леониды',     ra: 152, dec: 22,  from: [11, 6],  to: [11, 30], peak: [11, 17], zhr: 15,  parent: 'кометы Темпеля — Туттля (55P)' },
    { id: 'gem', ru: 'Геминиды',    ra: 112, dec: 33,  from: [12, 4],  to: [12, 20], peak: [12, 14], zhr: 150, parent: 'астероида Фаэтон — редкий поток не от кометы' },
    { id: 'urs', ru: 'Урсиды',      ra: 217, dec: 76,  from: [12, 17], to: [12, 26], peak: [12, 22], zhr: 10,  parent: 'кометы Туттля (8P)' },
  ];
  const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const dayMonth = md => `${md[1]} ${MONTHS_GEN[md[0] - 1]}`;
  const daysWord = n => { const t = n % 10, h = n % 100; return `${n} ${t === 1 && h !== 11 ? 'день' : t >= 2 && t <= 4 && (h < 12 || h > 14) ? 'дня' : 'дней'}`; };
  const FE0E = '︎';
  const D2R = Math.PI / 180, R2D = 180 / Math.PI;

  const css = getComputedStyle(document.documentElement);
  const C = n => css.getPropertyValue(n).trim();
  const COL = { night: C('--sky-night'), zenith: C('--sky-zenith'), twilight: C('--sky-twilight'), ground: C('--ground'), horizon: C('--horizon'),
    con: C('--con-line'), conZ: C('--con-zodiac'), conLabel: C('--con-label'), accent: C('--accent'), ecl: C('--ecliptic'), text: C('--text'),
    dim: C('--text-dim'), muted: C('--muted'), sun: C('--sun'), moon: C('--moon'), planet: C('--planet'), target: C('--target'),
    stars: [0, 1, 2, 3, 4].map(i => C('--star-' + i)), bg: C('--bg-black'),
    minor: C('--minor'), comet: C('--comet'), cometTail: C('--comet-tail'), probe: C('--probe'), meteor: C('--meteor'), guest: C('--guest') };
  const KIND_COL = { dwarf: COL.minor, asteroid: COL.minor, comet: COL.comet, interstellar: COL.guest, probe: COL.probe, meteor: COL.meteor };

  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* без памяти — без запоминания */ } }
  };
  const el = id => document.getElementById(id);
  const ui = { canvas: el('sky'), place: el('place'), mode: el('mode'), hint: el('hint'), aim: el('aim'), bodies: el('bodies'), card: el('card'),
    ring: el('aim-ring'), ringFill: el('aim-fill') };
  const ctx = ui.canvas.getContext('2d');

  /* ===== СТАТИСТИКА =====
     Та же очередь, что у экрана дня (astrolab_events): отправит её экран
     дня при следующем открытии. Без согласия — не пишем. */
  function track(name, props) {
    if (store.get('astrolab_stats_consent') !== true) return;   // только с согласия, его спрашивает экран дня
    const id = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random();
    const q = store.get('astrolab_events') || [];
    q.push({ id, name, at: new Date().toISOString(), ...(props ? { props } : {}) });
    store.set('astrolab_events', q.slice(-500));
  }

  /* ===== МЕСТО: GPS ===== */
  const PLACE_KEY = 'astrolab_sky_place';
  let place = store.get(PLACE_KEY);           // { lat, lon, at, source }
  // Место — ближайшим городом из справочника (cities.json), без координат:
  // градусы ничего не говорят и только сбивают. Справочник — тот же, что
  // у ввода места рождения, лежит в приложении, интернет не нужен.
  let cities = null;
  fetch('cities.json').then(r => r.json()).then(j => { cities = j.rows; showPlace(); }).catch(() => { cities = []; showPlace(); });
  function nearestCity(lat, lon) {
    let best = null, d0 = Infinity;
    const k = Math.cos(lat * D2R);
    for (const r of cities || []) { const dy = r[3] - lat, dx = (r[4] - lon) * k, d = dx * dx + dy * dy; if (d < d0) { d0 = d; best = r; } }
    return best && { name: best[0], km: Math.sqrt(d0) * 111.2 };
  }
  function showPlace() {
    if (!place) { ui.place.textContent = 'Место не определено'; return; }
    if (place.source === 'default') { ui.place.textContent = 'Москва — место не определено'; return; }
    const src = place.source === 'birth' ? ' · место рождения' : '';
    if (!cities) { ui.place.textContent = 'Определяем место…'; return; }
    const c = nearestCity(place.lat, place.lon);
    ui.place.textContent = (c ? (c.km < 30 ? c.name : `${Math.round(c.km)} км от: ${c.name}`) : 'Ваше место') + src;
  }
  function locate() {
    if (!navigator.geolocation) return fallbackPlace();
    navigator.geolocation.getCurrentPosition(p => {
      place = { lat: p.coords.latitude, lon: p.coords.longitude, at: Date.now(), source: 'gps' };
      store.set(PLACE_KEY, place); showPlace(); refreshFrames();
    }, () => fallbackPlace(), { enableHighAccuracy: false, timeout: 15000, maximumAge: 6 * 3600 * 1000 });
  }
  // GPS не дал места: прошлое известное, иначе — место рождения (с пометкой).
  // Ошибка в сотню километров на небе почти не видна: это доли градуса.
  function fallbackPlace() {
    if (place) { showPlace(); return; }
    const prof = store.get('astrolab_day_profile');
    if (prof && prof.place) { place = { lat: prof.place.lat, lon: prof.place.lon, at: Date.now(), source: 'birth' }; showPlace(); refreshFrames();

    else { place = { lat: 55.75, lon: 37.62, at: Date.now(), source: 'default' }; showPlace(); refreshFrames(); say('Место не определено — небо показано для Москвы.'); }
  }

  /* ===== ДАННЫЕ НЕБА ===== */
  let SKY = null;                 // sky.json
  let planets = [];               // [{ id, ra, dec, lon, … }] — из движка
  let jdPlanets = 0;
  const engine = (() => { try { return new Worker('engine.js', { type: 'module' }); } catch (e) { return null; } })();
  if (engine) engine.onmessage = e => { if (e.data.type === 'sky') { planets = e.data.bodies; jdPlanets = e.data.jd; refreshFrames(); renderChips(); } };
  const askPlanets = () => engine && engine.postMessage({ type: 'sky', ms: Date.now() });

  /* ===== ЕЩЁ В КОСМОСЕ: ГДЕ ТЕЛО СЕЙЧАС =====
     У тела один или несколько кусков таблицы (tracks): кометы хранятся,
     только пока ярче 15m, зонды — кроме дней пролёта у Земли. Вне кусков
     тела на небе нет. Между узлами — линейно; RA разворачивается через 0°. */
  let BODIES = null;                       // bodies.json
  const EXTRAS_KEY = 'astrolab_sky_extras';
  let extrasOn = store.get(EXTRAS_KEY) !== false;
  function bodyAt(b, jd) {
    const d = jd - BODIES.jd0;
    for (const t of b.tracks) {
      const x = (d - t.t0) / t.step, n = t.ra.length;
      if (n < 2 || x < 0 || x > n - 1) continue;
      const i = Math.min(n - 2, Math.floor(x)), k = x - i;
      let r0 = t.ra[i], r1 = t.ra[i + 1];
      if (r1 - r0 > 180) r1 -= 360; else if (r0 - r1 > 180) r1 += 360;
      const lerp = a => a[i] + (a[i + 1] - a[i]) * k;
      const mag = t.mag && t.mag[i] !== null && t.mag[i + 1] !== null ? lerp(t.mag) : null;
      return { ra: ((r0 + (r1 - r0) * k) % 360 + 360) % 360, dec: lerp(t.dec), dist: lerp(t.au), mag };
    }
    return null;
  }
  // поток активен в этот день года; границы бывают через Новый год
  function showerActive(s, date) {
    const md = (date.getMonth() + 1) * 100 + date.getDate(), a = s.from[0] * 100 + s.from[1], b = s.to[0] * 100 + s.to[1];
    return a <= b ? md >= a && md <= b : md >= a || md <= b;
  }
  function daysToPeak(s, date) {
    let best = Infinity;
    for (const y of [date.getFullYear() - 1, date.getFullYear(), date.getFullYear() + 1]) {
      const d = (new Date(y, s.peak[0] - 1, s.peak[1]) - new Date(date.getFullYear(), date.getMonth(), date.getDate())) / 86400000;
      if (Math.abs(d) < Math.abs(best)) best = d;
    }
    return Math.round(best);
  }
  const isExtra = id => frame && frame.extras.some(e => e.id === id);
  const nameOf = id => NAMES[id] || (frame && (frame.extras.find(e => e.id === id) || {}).ru) || '';
  // короткое имя для кнопки и подписи на небе: без слова «Комета»
  const shortName = e => e.ru.replace(/^Комета /, '');

  /* ===== АСТРОНОМИЯ: ЭКВАТОР → ГОРИЗОНТ =====
     Вектор на небе в системе «восток, север, зенит» (ENU). Через часовой
     угол, без промежуточных высоты и азимута: так дешевле, а прожектор
     ниже всё равно работает с векторами. */
  const jdNow = () => Date.now() / 86400000 + 2440587.5;
  function lstDeg(jd, lon) {
    const T = (jd - 2451545) / 36525;
    const gmst = 280.46061837 + 360.98564736629 * (jd - 2451545) + 0.000387933 * T * T - T * T * T / 38710000;
    return (((gmst + lon) % 360) + 360) % 360;
  }
  function enu(raDeg, decDeg, lst, sinPhi, cosPhi, out, i) {
    const H = (lst - raDeg) * D2R, d = decDeg * D2R, cd = Math.cos(d), sd = Math.sin(d), cH = Math.cos(H);
    out[i] = -cd * Math.sin(H);
    out[i + 1] = cosPhi * sd - sinPhi * cd * cH;
    out[i + 2] = sinPhi * sd + cosPhi * cd * cH;
  }
  // обратно: ENU → RA/Dec — «что перед вами» и в каком созвездии центр экрана
  function raDecOf(E, N, U, lst, sinPhi, cosPhi) {
    const dec = Math.asin(Math.max(-1, Math.min(1, sinPhi * U + cosPhi * N))) * R2D;
    const H = Math.atan2(-E, cosPhi * U - sinPhi * N) * R2D;
    return [(((lst - H) % 360) + 360) % 360, dec];
  }
  // эклиптика J2000 → экватор J2000
  const EPS = 23.4392911 * D2R;
  const eclToEq = lam => { const l = lam * D2R; return [((Math.atan2(Math.sin(l) * Math.cos(EPS), Math.cos(l)) * R2D) + 360) % 360, Math.asin(Math.sin(l) * Math.sin(EPS)) * R2D]; };
  // прецессия от J2000 до сегодня, °: знаки — от точки равноденствия ДАТЫ
  const precession = jd => (jd - 2451545) / 365.25 * 50.29 / 3600;

  // точка внутри границы созвездия (кольцо RA/Dec). Кольца пересекают
  // 0°/360°, поэтому RA разворачиваются относительно первой вершины.
  function inside(ra, dec, ring) {
    const n = ring.length / 2, xs = new Array(n);
    let base = ring[0];
    for (let i = 0; i < n; i++) { let x = ring[2 * i]; while (x - base > 180) x -= 360; while (base - x > 180) x += 360; xs[i] = x; base = x; }
    for (const shift of [0, 360, -360]) {
      const px = ra + shift; let c = false;
      for (let i = 0, j = n - 1; i < n; j = i++) {
        const yi = ring[2 * i + 1], yj = ring[2 * j + 1];
        if ((yi > dec) !== (yj > dec) && px < (xs[j] - xs[i]) * (dec - yi) / (yj - yi) + xs[i]) c = !c;
      }
      if (c) return true;
    }
    return false;
  }
  const constellationAt = (ra, dec) => SKY && SKY.cons.find(c => c.bounds.some(r => inside(ra, dec, r)));

  /* ===== КАДР НЕБА ===== пересчитывается раз в несколько секунд:
     небо поворачивается на 0,25° в минуту — каждому кадру это не нужно */
  let frame = null;
  function refreshFrames() {
    if (!SKY || !place) return;
    const jd = jdNow(), lst = lstDeg(jd, place.lon), phi = place.lat * D2R, sP = Math.sin(phi), cP = Math.cos(phi);
    const stars = new Float32Array(SKY.stars.length * 3);
    SKY.stars.forEach((s, i) => enu(s[0], s[1], lst, sP, cP, stars, i * 3));
    const lines = SKY.cons.map(c => c.lines.map(l => { const a = new Float32Array(l.length / 2 * 3); for (let i = 0; i < l.length / 2; i++) enu(l[2 * i], l[2 * i + 1], lst, sP, cP, a, i * 3); return a; }));
    const labels = new Float32Array(SKY.cons.length * 3);
    SKY.cons.forEach((c, i) => enu(c.label[0], c.label[1], lst, sP, cP, labels, i * 3));
    const ecl = new Float32Array(181 * 3);
    for (let k = 0; k <= 180; k++) { const [r, d] = eclToEq(k * 2); enu(r, d, lst, sP, cP, ecl, k * 3); }
    const p = precession(jd), signs = new Float32Array(24 * 3);
    for (let k = 0; k < 12; k++) {
      let [r, d] = eclToEq(30 * k - p); enu(r, d, lst, sP, cP, signs, k * 6);           // граница знака
      [r, d] = eclToEq(30 * k + 15 - p); enu(r, d, lst, sP, cP, signs, k * 6 + 3);      // середина — для значка
    }
    const bodies = planets.map(b => { const v = new Float32Array(3); enu(b.ra, b.dec, lst, sP, cP, v, 0); return { ...b, v }; });
    frame = { jd, lst, sP, cP, stars, lines, labels, ecl, signs, bodies, extras: extrasFrame(jd, lst, sP, cP, bodies) };
  }

  // «ещё в космосе» на этот кадр: тела из таблицы и активные потоки
  function extrasFrame(jd, lst, sP, cP, bodies) {
    const out = [];
    if (!BODIES) return out;
    const sun = bodies.find(b => b.id === 'sun');
    for (const b of BODIES.bodies) {
      const p = bodyAt(b, jd); if (!p) continue;
      const v = new Float32Array(3); enu(p.ra, p.dec, lst, sP, cP, v, 0);
      const e = { id: b.id, kind: b.kind, ru: b.ru, name: b.name, ...p, v };
      // хвост кометы — от Солнца, по большому кругу; длиннее у яркой
      if ((b.kind === 'comet' || b.kind === 'interstellar') && sun && p.mag !== null && p.mag < 13) {
        const s = sun.v, dot = s[0] * v[0] + s[1] * v[1] + s[2] * v[2];
        const t = [dot * v[0] - s[0], dot * v[1] - s[1], dot * v[2] - s[2]], n = Math.hypot(t[0], t[1], t[2]);
        if (n > 1e-6) {
          const L = Math.max(1.5, Math.min(8, (13 - p.mag) * 1.2)) * D2R, c = Math.cos(L), sn = Math.sin(L) / n;
          e.tail = new Float32Array([v[0] * c + t[0] * sn, v[1] * c + t[1] * sn, v[2] * c + t[2] * sn]);
        }
      }
      out.push(e);
    }
    const now = new Date(Date.now());
    for (const s of SHOWERS) {
      if (!showerActive(s, now)) continue;
      const v = new Float32Array(3); enu(s.ra, s.dec, lst, sP, cP, v, 0);
      out.push({ id: 'm-' + s.id, kind: 'meteor', ru: s.ru, shower: s, ra: s.ra, dec: s.dec, dist: 0, mag: null, v });
    }
    return out;
  }
  // за чем охотится прицел и тап: планеты, а при включённом слое — и остальное
  const targets = () => frame ? (extrasOn ? frame.bodies.concat(frame.extras) : frame.bodies) : [];
  const findTarget = id => targets().find(x => x.id === id);

  /* ===== ОРИЕНТАЦИЯ ТЕЛЕФОНА =====
     R — матрица «телефон → земля» (столбцы — оси телефона в ENU), как
     в спецификации W3C DeviceOrientation: z-x'-y'' по alpha, beta, gamma.
     Камера (задняя сторона) смотрит вдоль −z телефона. */
  let mode = 'drag';               // 'compass' | 'tilt' (наклон без компаса) | 'drag'
  let R = null, Rs = null;         // сырая и сглаженная
  let azOffset = store.get('astrolab_sky_az_offset') || 0;   // поправка компаса, °
  let viewAz = 180, viewAlt = 30;  // для режима «пальцем»

  function matrixFromEuler(a, b, g) {
    a *= D2R; b *= D2R; g *= D2R;
    const cA = Math.cos(a), sA = Math.sin(a), cB = Math.cos(b), sB = Math.sin(b), cG = Math.cos(g), sG = Math.sin(g);
    return [cA * cG - sA * sB * sG, -cB * sA, cA * sG + cG * sA * sB,
            cG * sA + cA * sB * sG, cA * cB, sA * sG - cA * cG * sB,
            -cB * sG, sB, cB * cG];
  }
  function matrixFromView(az, alt) {
    const a = az * D2R, h = alt * D2R;
    const v = [Math.cos(h) * Math.sin(a), Math.cos(h) * Math.cos(a), Math.sin(h)];
    const z = [-v[0], -v[1], -v[2]];
    let y = [-v[2] * v[0], -v[2] * v[1], 1 - v[2] * v[2]];
    const ny = Math.hypot(y[0], y[1], y[2]) || 1; y = y.map(t => t / ny);
    const x = [y[1] * z[2] - y[2] * z[1], y[2] * z[0] - y[0] * z[2], y[0] * z[1] - y[1] * z[0]];
    return [x[0], y[0], z[0], x[1], y[1], z[1], x[2], y[2], z[2]];
  }
  // сглаживание: смешиваем матрицы и возвращаем столбцам ортонормальность —
  // по углам Эйлера так нельзя: у вертикально поднятого телефона alpha
  // и gamma скачут (вырождение при beta = 90°), а матрица непрерывна
  function smooth(prev, next, k) {
    if (!prev) return next.slice();
    const m = prev.map((p, i) => p + (next[i] - p) * k);
    const col = j => [m[j], m[3 + j], m[6 + j]];
    let x = col(0), y = col(1);
    const nx = Math.hypot(...x); x = x.map(t => t / nx);
    const d = x[0] * y[0] + x[1] * y[1] + x[2] * y[2]; y = y.map((t, i) => t - d * x[i]);
    const ny = Math.hypot(...y); y = y.map(t => t / ny);
    const z = [x[1] * y[2] - x[2] * y[1], x[2] * y[0] - x[0] * y[2], x[0] * y[1] - x[1] * y[0]];
    return [x[0], y[0], z[0], x[1], y[1], z[1], x[2], y[2], z[2]];
  }

  let gotAbsolute = false, gotRelative = false;
  window.addEventListener('deviceorientationabsolute', e => {
    if (e.alpha == null) return;
    gotAbsolute = true;
    if (mode !== 'drag') { mode = 'compass'; R = matrixFromEuler(e.alpha, e.beta, e.gamma); }
  }, true);
  window.addEventListener('deviceorientation', e => {
    if (e.alpha == null || gotAbsolute) return;
    gotRelative = true;
    // absolute: true — тот же компас по старому имени события
    if (mode !== 'drag') { mode = e.absolute ? 'compass' : 'tilt'; R = matrixFromEuler(e.alpha, e.beta, e.gamma); }
  }, true);

  // через полторы секунды решаем, что есть у телефона
  function chooseMode(initial) {
    if (gotAbsolute || gotRelative) {
      mode = gotAbsolute ? 'compass' : 'tilt';
      say(mode === 'compass'
        ? 'Наведите телефон на небо. Если картинка сдвинута — проведите пальцем влево или вправо, чтобы подправить компас. Уплывает — поводите телефоном восьмёркой.'
        : 'Компас недоступен: проведите пальцем влево или вправо, чтобы развернуть небо по сторонам света.', 9000);
    } else {
      mode = 'drag';
      say('Датчиков нет — водите небо пальцем.', 6000);
    }
    ui.mode.textContent = mode === 'drag' ? 'Датчики' : 'Пальцем';
    ui.mode.hidden = !(gotAbsolute || gotRelative);
    if (initial) track('sky.open', { mode: mode === 'drag' ? 'drag' : 'compass' });
  }
  ui.mode.addEventListener('click', () => {
    if (mode === 'drag') { mode = gotAbsolute ? 'compass' : 'tilt'; Rs = null; }
    else { mode = 'drag'; const v = viewDir(); viewAz = v.az; viewAlt = v.alt; }
    ui.mode.textContent = mode === 'drag' ? 'Датчики' : 'Пальцем';
  });

  /* ===== ЖЕСТЫ =====
     С датчиками горизонтальный свайп поправляет компас (запоминается),
     без них — водит небо. Короткое касание — выбрать планету. */
  let drag = null;
  ui.canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t: Date.now() }; ui.canvas.setPointerCapture(e.pointerId); });
  ui.canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y, degPerPx = fovDeg() / ui.canvas.clientHeight;
    drag.x = e.clientX; drag.y = e.clientY;
    if (mode === 'drag') { viewAz = (viewAz - dx * degPerPx + 360) % 360; viewAlt = Math.max(-80, Math.min(85, viewAlt + dy * degPerPx)); }
    else { azOffset = ((azOffset + dx * degPerPx) % 360 + 360) % 360; }
  });
  ui.canvas.addEventListener('pointerup', e => {
    if (!drag) return;
    const moved = Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0);
    if (moved < 8 && Date.now() - drag.t < 500) pick(e.clientX, e.clientY);
    if (mode !== 'drag') store.set('astrolab_sky_az_offset', azOffset);
    drag = null;
  });

  /* ===== ПРОЕКЦИЯ ===== */
  let W = 0, H = 0, dpr = 1, f = 1;
  const fovDeg = () => 62;                       // по вертикали — примерно как у камеры телефона
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = ui.canvas.clientWidth; H = ui.canvas.clientHeight;
    ui.canvas.width = W * dpr; ui.canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    f = (H / 2) / Math.tan(fovDeg() / 2 * D2R);
  }
  window.addEventListener('resize', resize);

  let M = null;                                  // текущая матрица кадра
  const cosOff = () => Math.cos(azOffset * D2R), sinOff = () => Math.sin(azOffset * D2R);
  let cO = 1, sO = 0;
  // ENU объекта → экран. Поправка компаса — поворот неба вокруг зенита.
  function project(E, N, U, out) {
    const e = cO * E + sO * N, n = -sO * E + cO * N;
    const dx = M[0] * e + M[3] * n + M[6] * U, dy = M[1] * e + M[4] * n + M[7] * U, dz = M[2] * e + M[5] * n + M[8] * U;
    out.front = dz < -0.02;
    out.dx = dx; out.dy = dy; out.dz = dz;
    if (!out.front) return out;
    out.x = W / 2 + f * dx / -dz; out.y = H / 2 - f * dy / -dz;
    return out;
  }
  // куда смотрит центр экрана (для «Перед вами» и смены режима)
  function viewDir() {
    if (!M) return { az: viewAz, alt: viewAlt, E: 0, N: 1, U: 0 };
    let E = -M[2], N = -M[5], U = -M[8];
    const e = cO * E - sO * N, n = sO * E + cO * N; E = e; N = n;     // обратная поправка компаса
    return { az: ((Math.atan2(E, N) * R2D) + 360) % 360, alt: Math.asin(Math.max(-1, Math.min(1, U))) * R2D, E, N, U };
  }

  /* ===== РИСОВАНИЕ ===== */
  const P = {}, Q = {};
  function sunAlt() { const s = frame && frame.bodies.find(b => b.id === 'sun'); return s ? Math.asin(s.v[2]) * R2D : -90; }

  function draw() {
    requestAnimationFrame(draw);
    if (document.hidden || !frame) return;
    // матрица кадра: датчики (сглаженные) или «пальцем»
    if (mode === 'drag' || !R) M = matrixFromView(viewAz, viewAlt);
    else { Rs = smooth(Rs, R, 0.22); M = Rs; }
    cO = cosOff(); sO = sinOff();

    // фон: ночь, сумерки или день — по высоте Солнца
    const sa = sunAlt();
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, sa > -6 ? COL.twilight : COL.zenith); g.addColorStop(1, COL.night);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    drawConstellations();
    drawEcliptic();
    drawStars(sa);
    drawGround();
    if (extrasOn) drawExtras();
    drawBodies();
    drawTarget();
    updateDwell();
    updateAim();
  }

  function drawStars(sa) {
    const s = frame.stars, mags = SKY.stars, day = sa > -6 ? 0.35 : 1;
    for (let i = 0; i < mags.length; i++) {
      project(s[i * 3], s[i * 3 + 1], s[i * 3 + 2], P);
      if (!P.front || P.x < -10 || P.x > W + 10 || P.y < -10 || P.y > H + 10) continue;
      const m = mags[i][2], r = Math.max(0.55, (6 - m) * 0.62);
      ctx.globalAlpha = Math.min(1, 0.25 + (6 - m) / 5) * day * (s[i * 3 + 2] < 0 ? 0.3 : 1);
      ctx.fillStyle = COL.stars[mags[i][3]];
      ctx.beginPath(); ctx.arc(P.x, P.y, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // имена ярких звёзд
    ctx.font = '11px ' + C('--font'); ctx.fillStyle = COL.muted; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    for (const [i, name] of SKY.names) {
      project(s[i * 3], s[i * 3 + 1], s[i * 3 + 2], P);
      if (P.front && P.x > 0 && P.x < W && P.y > 0 && P.y < H && s[i * 3 + 2] > -0.05) ctx.fillText(name, P.x + 6, P.y);
    }
  }

  function drawConstellations() {
    ctx.lineWidth = 1;
    SKY.cons.forEach((c, ci) => {
      ctx.strokeStyle = ZODIAC_CONS.has(c.id) ? COL.conZ : COL.con;
      for (const a of frame.lines[ci]) {
        ctx.beginPath(); let started = false;
        for (let k = 0; k < a.length / 3; k++) {
          project(a[k * 3], a[k * 3 + 1], a[k * 3 + 2], P);
          if (!P.front) { started = false; continue; }
          if (started) ctx.lineTo(P.x, P.y); else { ctx.moveTo(P.x, P.y); started = true; }
        }
        ctx.stroke();
      }
    });
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    SKY.cons.forEach((c, ci) => {
      const L = frame.labels; project(L[ci * 3], L[ci * 3 + 1], L[ci * 3 + 2], P);
      if (!P.front || P.x < 0 || P.x > W || P.y < 0 || P.y > H) return;
      const z = ZODIAC_CONS.has(c.id);
      ctx.font = (z ? '600 12px ' : '11px ') + C('--font');
      ctx.fillStyle = z ? COL.accent : COL.conLabel;
      ctx.fillText(c.ru.toUpperCase(), P.x, P.y);
    });
  }

  // эклиптика — путь Солнца; на ней границы и значки знаков зодиака
  function drawEcliptic() {
    const a = frame.ecl;
    ctx.strokeStyle = COL.ecl; ctx.lineWidth = 1.2; ctx.setLineDash([6, 5]);
    ctx.beginPath(); let started = false;
    for (let k = 0; k <= 180; k++) {
      project(a[k * 3], a[k * 3 + 1], a[k * 3 + 2], P);
      if (!P.front) { started = false; continue; }
      if (started) ctx.lineTo(P.x, P.y); else { ctx.moveTo(P.x, P.y); started = true; }
    }
    ctx.stroke(); ctx.setLineDash([]);
    const s = frame.signs;
    for (let k = 0; k < 12; k++) {
      project(s[k * 6], s[k * 6 + 1], s[k * 6 + 2], P);
      if (P.front) { ctx.fillStyle = COL.ecl; ctx.fillRect(P.x - 1, P.y - 7, 2, 14); }
      project(s[k * 6 + 3], s[k * 6 + 4], s[k * 6 + 5], P);
      if (P.front && P.x > -20 && P.x < W + 20 && P.y > -20 && P.y < H + 20) {
        ctx.fillStyle = COL.bg; ctx.beginPath(); ctx.arc(P.x, P.y, 11, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = COL.ecl; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = COL.accent; ctx.font = '14px ' + C('--glyph-font'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(SIGN_GLYPH[k] + FE0E, P.x, P.y + 1);
      }
    }
  }

  // Земля: при гномонической проекции горизонт — прямая, земля —
  // полуплоскость A·x + B·y + C < 0. Режем прямоугольник экрана этой
  // прямой и заливаем, что ниже.
  function drawGround() {
    const u0 = M[6], u1 = M[7], u2 = M[8];       // зенит в осях телефона (строка R)
    // с поправкой компаса зенит не меняется — поворот вокруг него
    const A = u0 / f, B = -u1 / f, Cc = -u0 * (W / 2) / f + u1 * (H / 2) / f - u2;
    const val = (x, y) => A * x + B * y + Cc;
    const rect = [[0, 0], [W, 0], [W, H], [0, H]], poly = [], cut = [];
    for (let i = 0; i < 4; i++) {
      const p = rect[i], q = rect[(i + 1) % 4], vp = val(p[0], p[1]), vq = val(q[0], q[1]);
      if (vp < 0) poly.push(p);
      if ((vp < 0) !== (vq < 0)) { const t = vp / (vp - vq), pt = [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]; poly.push(pt); cut.push(pt); }
    }
    if (poly.length > 2) {
      ctx.fillStyle = COL.ground; ctx.beginPath(); ctx.moveTo(poly[0][0], poly[0][1]);
      for (const p of poly.slice(1)) ctx.lineTo(p[0], p[1]);
      ctx.closePath(); ctx.fill();
    }
    if (cut.length === 2) {
      ctx.strokeStyle = COL.horizon; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cut[0][0], cut[0][1]); ctx.lineTo(cut[1][0], cut[1][1]); ctx.stroke();
    }
    // стороны света на горизонте
    ctx.font = '600 13px ' + C('--font'); ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    POINTS.forEach((name, k) => {
      const az = k * 45 * D2R; project(Math.sin(az), Math.cos(az), 0, P);
      if (!P.front || P.x < 0 || P.x > W || P.y < 0 || P.y > H) return;
      ctx.fillStyle = k === 0 ? COL.accent : COL.horizon; ctx.fillText(name, P.x, P.y - 4);
    });
  }

  let selected = null;
  function drawBodies() {
    // дальние сначала: Луна и Солнце поверх планет
    const list = [...frame.bodies].sort((a, b) => b.dist - a.dist);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const b of list) {
      project(b.v[0], b.v[1], b.v[2], P);
      b.screen = P.front ? { x: P.x, y: P.y } : null;
      if (!P.front) continue;
      const below = b.v[2] < 0, big = b.id === 'sun' || b.id === 'moon', r = big ? 14 : 11;
      ctx.globalAlpha = below ? 0.45 : 1;
      if (b.id === 'sun') { const glow = ctx.createRadialGradient(P.x, P.y, 2, P.x, P.y, 36); glow.addColorStop(0, COL.sun); glow.addColorStop(1, 'transparent'); ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(P.x, P.y, 36, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = COL.bg; ctx.beginPath(); ctx.arc(P.x, P.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = b.id === 'sun' ? COL.sun : b.id === 'moon' ? COL.moon : COL.planet; ctx.lineWidth = selected === b.id ? 2.5 : 1.3; ctx.stroke();
      ctx.fillStyle = b.id === 'sun' ? COL.sun : b.id === 'moon' ? COL.moon : COL.planet;
      ctx.font = (big ? 17 : 14) + 'px ' + C('--glyph-font'); ctx.fillText(GLYPH[b.id] + FE0E, P.x, P.y + 1);
      // имя планеты в прицеле — в строке под кольцом, внутри кольца оно мешает
      if (dwell.id !== b.id) { ctx.font = '11px ' + C('--font'); ctx.fillStyle = COL.dim; ctx.fillText(NAMES[b.id], P.x, P.y + r + 9); }
      ctx.globalAlpha = 1;
    }
  }

  /* ===== ЕЩЁ В КОСМОСЕ: РИСОВАНИЕ =====
     Мельче и тише планет. Чем тусклее тело, тем прозрачнее; то, что
     глазом не видно (слабее 6m), — контуром, а не точкой. */
  function drawExtras() {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const e of frame.extras) {
      project(e.v[0], e.v[1], e.v[2], P);
      e.screen = P.front ? { x: P.x, y: P.y } : null;
      if (!P.front || P.x < -60 || P.x > W + 60 || P.y < -60 || P.y > H + 60) continue;
      const col = KIND_COL[e.kind], below = e.v[2] < 0;
      const seen = e.mag !== null && e.mag <= 6, fade = e.mag === null ? 0.85 : e.mag <= 6 ? 1 : e.mag <= 9 ? 0.85 : e.mag <= 14 ? 0.65 : 0.5;
      ctx.globalAlpha = fade * (below ? 0.45 : 1);
      ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = selected === e.id ? 2 : 1.2;
      const x = P.x, y = P.y;
      if (e.tail) {
        project(e.tail[0], e.tail[1], e.tail[2], Q);
        if (Q.front) {
          const g = ctx.createLinearGradient(x, y, Q.x, Q.y); g.addColorStop(0, COL.cometTail); g.addColorStop(1, 'transparent');
          ctx.strokeStyle = g; ctx.lineWidth = 3; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(Q.x, Q.y); ctx.stroke();
          ctx.lineCap = 'butt'; ctx.strokeStyle = col; ctx.lineWidth = selected === e.id ? 2 : 1.2;
        }
      }
      if (e.kind === 'probe') {
        ctx.beginPath(); ctx.moveTo(x, y - 5); ctx.lineTo(x + 5, y); ctx.lineTo(x, y + 5); ctx.lineTo(x - 5, y); ctx.closePath(); ctx.stroke();
      } else if (e.kind === 'meteor') {
        for (let k = 0; k < 8; k++) {
          const a = k * Math.PI / 4, r0 = 3, r1 = k % 2 ? 7 : 10;
          ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0); ctx.lineTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1); ctx.stroke();
        }
      } else if (e.kind === 'interstellar') {
        ctx.setLineDash([2, 2]); ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      } else if (seen || (e.mag !== null && e.mag <= 9)) {
        ctx.beginPath(); ctx.arc(x, y, seen ? 3.5 : 2.6, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.stroke();
      }
      if (selected === e.id) { ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2); ctx.stroke(); }
      if (dwell.id !== e.id) { ctx.font = '10px ' + C('--font'); ctx.fillText(shortName(e), x, y + (selected === e.id ? 20 : e.kind === 'meteor' ? 17 : 12)); }
    }
    ctx.globalAlpha = 1;
  }

  // выбранная планета за краем экрана — стрелка у края в её сторону
  function drawTarget() {
    if (!selected) return;
    const b = findTarget(selected); if (!b) return;
    project(b.v[0], b.v[1], b.v[2], Q);
    if (Q.front && Q.x > 20 && Q.x < W - 20 && Q.y > 70 && Q.y < H - 70) return;
    let ang = Math.atan2(-Q.dy, Q.dx);
    if (!Q.front && Math.hypot(Q.dx, Q.dy) < 1e-3) ang = Math.PI / 2;
    const cx = W / 2, cy = H / 2, rx = W / 2 - 34, ry = H / 2 - 96;
    const t = Math.min(Math.abs(rx / Math.cos(ang) || 1e9), Math.abs(ry / Math.sin(ang) || 1e9));
    const x = cx + Math.cos(ang) * t, y = cy + Math.sin(ang) * t;
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.fillStyle = COL.target; ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-8, -9); ctx.lineTo(-4, 0); ctx.lineTo(-8, 9); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.font = '600 12px ' + C('--font'); ctx.fillStyle = COL.target; ctx.textAlign = 'center';
    ctx.fillText(nameOf(b.id), x - Math.cos(ang) * 26, y - Math.sin(ang) * 26);
  }

  /* ===== ПРИЦЕЛ: ЗАДЕРЖАТЬ ПЛАНЕТУ 3 СЕКУНДЫ =====
     Ближайшая к центру планета ловится, когда входит в кольцо (30 px), и
     отпускается, только выйдя из большего круга (46 px): дрожь компаса не
     сбивает отсчёт. Короткий выход — до 0,35 с — тоже прощается. */
  const DWELL_MS = 3000, AIM_IN = 30, AIM_OUT = 46, AIM_GRACE = 350, RING_LEN = 157.08;
  let dwell = { id: null, start: 0, lostAt: 0, done: false };
  function updateDwell() {
    const now = performance.now(), cx = W / 2, cy = H / 2;
    let cand = null, dmin = Infinity;
    for (const b of targets()) { if (!b.screen) continue; const d = Math.hypot(b.screen.x - cx, b.screen.y - cy); if (d < dmin) { dmin = d; cand = b; } }
    if (dwell.id && cand && cand.id === dwell.id && dmin < AIM_OUT) dwell.lostAt = 0;
    else if (cand && dmin < AIM_IN) dwell = { id: cand.id, start: now, lostAt: 0, done: false };
    else if (dwell.id) {
      if (!dwell.lostAt) dwell.lostAt = now;
      else if (now - dwell.lostAt > AIM_GRACE) dwell = { id: null, start: 0, lostAt: 0, done: false };
    }
    const held = dwell.id && !dwell.lostAt;
    const p = !dwell.id ? 0 : dwell.done ? 1 : Math.min(1, (now - dwell.start) / DWELL_MS);
    ui.ring.classList.toggle('locked', !!dwell.id);
    ui.ringFill.style.strokeDashoffset = String(RING_LEN * (1 - p));
    if (held && p >= 1 && !dwell.done) { dwell.done = true; if (selected !== dwell.id) select(dwell.id); }
  }

  /* ===== «ПЕРЕД ВАМИ» ===== словами, без градусов */
  let lastAim = 0;
  function updateAim() {
    if (Date.now() - lastAim < 300) return; lastAim = Date.now();
    const v = viewDir();
    const [ra, dec] = raDecOf(v.E, v.N, v.U, frame.lst, frame.sP, frame.cP);
    const con = constellationAt(ra, dec);
    const parts = [];
    if (dwell.id) parts.push(nameOf(dwell.id));
    if (con) parts.push('созвездие ' + con.ru);
    const where = sideWord(v.az) + (v.alt < 0 ? ', под горизонтом' : '');
    const holding = dwell.id && !dwell.done && !dwell.lostAt ? ' · держите…' : '';
    ui.aim.textContent = (parts.length ? parts.join(' · ') + ' — ' : '') + where + holding;
  }

  /* ===== ПЛАНЕТЫ: СПИСОК И КАРТОЧКА ===== */
  function renderChips() {
    if (!frame) return;
    const chip = (id, glyph, name, below, col) => `<button type="button" class="sky-chip${selected === id ? ' on' : ''}${below ? ' below' : ''}" data-id="${id}"><i${col ? ` style="color:${col}"` : ''}>${glyph}${FE0E}</i>${name}</button>`;
    // в ряд — только то, что стоит искать: видно хотя бы в бинокль, кометы до 12m и потоки
    const worth = e => e.kind === 'meteor' || (e.mag !== null && (e.mag <= 9 || (e.kind === 'comet' && e.mag <= 12)));
    ui.bodies.innerHTML = frame.bodies.map(b => chip(b.id, GLYPH[b.id], NAMES[b.id], b.v[2] < 0)).join('')
      + `<button type="button" class="sky-chip layer" data-layer aria-pressed="${extrasOn}">✦${FE0E} Ещё в космосе</button>`
      + (extrasOn ? frame.extras.filter(worth).sort((a, b) => (a.mag ?? 0) - (b.mag ?? 0))
        .map(e => chip(e.id, KIND_GLYPH[e.kind], shortName(e), e.v[2] < 0, KIND_COL[e.kind])).join('') : '');
  }
  ui.bodies.addEventListener('click', e => {
    if (e.target.closest('[data-layer]')) {
      extrasOn = !extrasOn; store.set(EXTRAS_KEY, extrasOn);
      if (!extrasOn && selected && isExtra(selected)) closeCard(); else renderChips();
      say(extrasOn ? 'На небе — карликовые планеты, астероиды, кометы, зонды и метеорные потоки. Тап — что это.' : 'Остались только планеты.', 5000);
      return;
    }
    const b = e.target.closest('[data-id]'); if (b) select(b.dataset.id);
  });

  function pick(x, y) {
    let best = null, d0 = 32;
    for (const b of targets()) { if (!b.screen) continue; const d = Math.hypot(b.screen.x - x, b.screen.y - y); if (d < d0) { d0 = d; best = b.id; } }
    if (best) select(best); else closeCard();
  }
  function closeCard() { selected = null; ui.card.hidden = true; renderChips(); }

  // о чём дом — тот же список в day.html, wheel.html и sky.html (страницы самодостаточные); менять во всех трёх
  const HOUSE_ABOUT = ['', 'характер, внешность', 'свои деньги, вещи', 'общение, учёба', 'дом, семья, корни', 'влюблённость, дети, творчество',
    'работа, быт, здоровье', 'партнёр, брак, договоры', 'общие деньги, долги, близость', 'поездки, мировоззрение', 'карьера, статус, репутация', 'друзья, общие планы', 'подсознание, уединение'];

  // натальный дом — по куспидам из сохранённого расчёта дня
  function houseOf(lon, cusps) {
    for (let i = 0; i < 12; i++) {
      const a = cusps[i], b = cusps[(i + 1) % 12], span = ((b - a) % 360 + 360) % 360, d = ((lon - a) % 360 + 360) % 360;
      if (d < span) return i + 1;
    }
    return null;
  }
  /* ===== КАРТОЧКА: РИСУНОК, ФАКТ, РАССТОЯНИЕ ===== */
  const AU_KM = 149597870.7, AU_LIGHT_S = 499.005;
  // фаза Луны — по разнице долгот Луны и Солнца (элонгации)
  // главные фазы — в пределах ±12° (около суток) от точной, между ними — серп и «растущая/убывающая Луна»
  const PHASE_MAIN = ['новолуние', 'первая четверть', 'полнолуние', 'последняя четверть'];
  const PHASE_BETWEEN = ['растущий серп', 'растущая Луна', 'убывающая Луна', 'убывающий серп'];
  function phaseName(e) {
    const k = Math.round(e / 90) % 4;
    return Math.abs(((e - k * 90 + 540) % 360) - 180) < 12 ? PHASE_MAIN[k] : PHASE_BETWEEN[Math.floor(e / 90) % 4];
  }
  function moonPhase() {
    const m = frame.bodies.find(x => x.id === 'moon'), s = frame.bodies.find(x => x.id === 'sun');
    if (!m || !s) return null;
    const e = ((m.lon - s.lon) % 360 + 360) % 360;
    return { e, lit: (1 - Math.cos(e * D2R)) / 2, name: phaseName(e) };
  }
  // her — «до неё»; signal — у зонда не свет, а радиосигнал
  function distanceLine(id, au, her = HER[id], signal = false) {
    const km = au * AU_KM, sec = au * AU_LIGHT_S;
    const dist = km >= 1e9 ? `${(km / 1e9).toFixed(2).replace('.', ',')} млрд км` : km >= 1e7 ? `${Math.round(km / 1e6).toLocaleString('ru-RU')} млн км`
      : km >= 1e6 ? `${(km / 1e6).toFixed(1).replace('.', ',')} млн км` : `${(Math.round(km / 100) * 100).toLocaleString('ru-RU')} км`;
    const mins = Math.round(sec / 60), hrs = Math.floor(mins / 60);
    const light = sec < 60 ? `${sec.toFixed(1).replace('.', ',')} секунды` : mins < 60 ? `${mins} мин` : `${hrs} ч${mins % 60 ? ` ${mins % 60} мин` : ''}`;
    return `Сейчас до ${her ? 'неё' : 'него'} <b>${dist}</b>: ${signal ? `радиосигнал оттуда идёт ${light}` : `свет, который вы видите, вышел оттуда ${light} назад`}.`;
  }

  // Рисунки — инлайн-SVG по мотивам фотографий: диск, полосы, кольца,
  // затемнение к краю. У Луны настоящая фаза на сейчас.
  const fillOf = v => `style="fill:var(${v})"`;
  function shade(id) {
    return `<radialGradient id="sh-${id}" cx=".38" cy=".34" r=".72"><stop offset=".55" style="stop-color:var(--pl-shade);stop-opacity:0"/><stop offset="1" style="stop-color:var(--pl-shade);stop-opacity:.6"/></radialGradient>`;
  }
  function planetSVG(id) {
    const disc = (r, v) => `<circle r="${r}" ${fillOf(v)}/>`;
    const clip = (r, inner) => `<clipPath id="cl-${id}"><circle r="${r}"/></clipPath><g clip-path="url(#cl-${id})">${inner}</g>`;
    const shadeOver = r => `<circle r="${r}" fill="url(#sh-${id})"/>`;
    let defs = shade(id), body = '';
    switch (id) {
      case 'sun':
        defs = `<radialGradient id="g-sun"><stop offset="0" style="stop-color:var(--pl-sun-core)"/><stop offset=".7" style="stop-color:var(--pl-sun)"/><stop offset="1" style="stop-color:var(--pl-sun-edge)"/></radialGradient>`
          + `<radialGradient id="g-glow"><stop offset=".5" style="stop-color:var(--pl-sun);stop-opacity:.45"/><stop offset="1" style="stop-color:var(--pl-sun);stop-opacity:0"/></radialGradient>`;
        body = `<circle r="50" fill="url(#g-glow)"/><circle r="32" fill="url(#g-sun)"/>`;
        break;
      case 'moon': {
        const ph = moonPhase(), r = 34;
        let lit = '';
        if (ph) {
          const rx = Math.abs(Math.cos(ph.e * D2R)) * r, waxing = ph.e < 180, crescent = ph.lit < 0.5;
          // освещённая половина + край тени-эллипс; на убыли — зеркально
          lit = `<path d="M0 ${-r} A${r} ${r} 0 0 1 0 ${r} A${rx.toFixed(1)} ${r} 0 0 ${crescent ? 0 : 1} 0 ${-r}Z" ${fillOf('--pl-moon')}${waxing ? '' : ' transform="scale(-1 1)"'}/>`;
        }
        body = disc(r, '--pl-moon-dark') + lit
          + `<g ${fillOf('--pl-moon-crater')} opacity=".35"><circle cx="-10" cy="-12" r="7"/><circle cx="9" cy="6" r="5"/><circle cx="-4" cy="15" r="4"/><circle cx="14" cy="-14" r="3"/></g>` + shadeOver(r);
        break;
      }
      case 'mercury':
        body = disc(28, '--pl-mercury') + clip(28, `<g ${fillOf('--pl-mercury-dark')} opacity=".55"><circle cx="-9" cy="-8" r="6"/><circle cx="10" cy="4" r="4"/><circle cx="-2" cy="14" r="3.5"/><circle cx="12" cy="-12" r="2.5"/><circle cx="-16" cy="8" r="3"/></g>`) + shadeOver(28);
        break;
      case 'venus':
        body = disc(32, '--pl-venus') + clip(32, `<g ${fillOf('--pl-venus-band')} opacity=".5"><ellipse cx="-4" cy="-14" rx="34" ry="5" transform="rotate(-8)"/><ellipse cx="6" cy="2" rx="34" ry="6" transform="rotate(-5)"/><ellipse cx="0" cy="18" rx="30" ry="4" transform="rotate(-10)"/></g>`) + shadeOver(32);
        break;
      case 'mars':
        body = disc(30, '--pl-mars') + clip(30, `<g ${fillOf('--pl-mars-dark')} opacity=".6"><ellipse cx="-8" cy="4" rx="12" ry="6" transform="rotate(-20)"/><ellipse cx="12" cy="-6" rx="7" ry="4"/><ellipse cx="4" cy="16" rx="9" ry="4"/></g><ellipse cx="0" cy="-29" rx="13" ry="6" ${fillOf('--pl-mars-cap')}/>`) + shadeOver(30);
        break;
      case 'jupiter':
        body = disc(36, '--pl-jupiter') + clip(36, `<g ${fillOf('--pl-jupiter-band')} opacity=".75"><rect x="-40" y="-24" width="80" height="5"/><rect x="-40" y="-11" width="80" height="7"/><rect x="-40" y="5" width="80" height="6"/><rect x="-40" y="19" width="80" height="4"/></g><ellipse cx="13" cy="13" rx="8" ry="4.5" ${fillOf('--pl-jupiter-spot')}/>`) + shadeOver(36);
        break;
      case 'saturn': {
        const ring = `style="fill:none;stroke:var(--pl-saturn-ring)"`;
        body = `<g transform="rotate(-16)"><ellipse rx="46" ry="12" ${ring} stroke-width="6" opacity=".9"/>`
          + disc(24, '--pl-saturn') + clip(24, `<g ${fillOf('--pl-saturn-band')} opacity=".7"><rect x="-30" y="-12" width="60" height="4"/><rect x="-30" y="2" width="60" height="5"/></g>`) + shadeOver(24)
          + `<path d="M-46 0A46 12 0 0 0 46 0" ${ring} stroke-width="6"/></g>`;
        break;
      }
      case 'uranus': {
        const ring = `style="fill:none;stroke:var(--pl-uranus-ring)"`;
        body = `<g transform="rotate(8)"><ellipse rx="7" ry="44" ${ring} stroke-width="1.5" opacity=".6"/>` + disc(27, '--pl-uranus') + shadeOver(27)
          + `<path d="M0 -44A7 44 0 0 1 0 44" ${ring} stroke-width="1.5"/></g>`;
        break;
      }
      case 'neptune':
        body = disc(27, '--pl-neptune') + clip(27, `<ellipse cx="-8" cy="6" rx="7" ry="4" ${fillOf('--pl-neptune-spot')}/><rect x="-30" y="-10" width="60" height="2" ${fillOf('--pl-uranus-ring')} opacity=".25"/>`) + shadeOver(27);
        break;
      case 'pluto':
        body = disc(24, '--pl-pluto') + clip(24, `<path d="M6 16C-4 10-6 2-2-2c3-3 7-2 8 1 1-3 6-4 8-1 4 4 0 12-8 18z" ${fillOf('--pl-pluto-heart')} opacity=".85"/>`) + shadeOver(24);
        break;
    }
    return `<svg viewBox="-50 -50 100 100" aria-hidden="true"><defs>${defs}</defs>${body}</svg>`;
  }

  function select(id) {
    if (isExtra(id)) return selectExtra(id);
    selected = id; renderChips();
    const b = frame.bodies.find(x => x.id === id); if (!b) return;
    track('sky.body', { body: id });
    const sign = Math.floor(((b.lon % 360) + 360) % 360 / 30), deg = Math.floor(((b.lon % 30) + 30) % 30);
    const con = constellationAt(b.ra, b.dec);
    const alt = Math.asin(b.v[2]) * R2D, az = ((Math.atan2(b.v[0], b.v[1]) * R2D) + 360) % 360;
    const conName = con ? con.ru : '—';
    const same = con && con.ru === SIGNS[sign];
    const cache = store.get('astrolab_day_forecast'), fc = cache && cache.data;
    const cusps = fc && fc.natal && fc.natal.houses ? fc.natal.houses.map(h => h.longitude) : null;
    const house = cusps ? houseOf(b.lon, cusps) : null;
    const today = fc ? [...new Set(fc.days[fc.days.length - 1].spheres.flatMap(s => s.drivers).filter(d => d.transit === id).map(d => d.text))].slice(0, 3) : [];
    const ph = id === 'moon' ? moonPhase() : null;
    const retro = id !== 'sun' && id !== 'moon' && b.speed < 0;
    const where = alt < 0 ? '<b>Под горизонтом</b> — сейчас не видно' : `${alt < 12 ? 'Низко над горизонтом' : alt > 60 ? 'Высоко в небе' : 'Над горизонтом'}, ${sideWord(az)}`;
    ui.card.innerHTML = `
      <div class="sky-card-head"><span class="sky-pic">${planetSVG(id)}</span>
        <div class="sky-card-title"><b>${NAMES[id]}</b><small><i>${GLYPH[id]}${FE0E}</i> ${SIGNS[sign]}, ${deg}°</small></div>
        <button class="sky-card-x" type="button" aria-label="Закрыть">×</button></div>
      <p class="sky-fact">${INFO[id].fact}</p>
      ${ph ? `<p class="sky-row">Фаза: <b>${ph.name}</b>, освещено ${Math.round(ph.lit * 100)}%</p>` : ''}
      ${b.dist ? `<p class="sky-row">${distanceLine(id, b.dist)}</p>` : ''}
      ${retro ? `<p class="sky-note">Сейчас ретроград: с Земли кажется, что планета пятится по зодиаку. Это эффект обгона — как соседний поезд, который будто едет назад, когда ваш его обгоняет.</p>` : ''}
      <p class="sky-row">${where}${house ? ` · в вашей карте — <b>${house}-й дом</b> (${HOUSE_ABOUT[house]})` : ''}</p>
      <p class="sky-row">Знак: <b>${SIGNS[sign]}</b> · на небе: <b>созвездие ${conName}</b></p>
      ${same ? '' : `<p class="sky-note">Знак и созвездие разные — это не ошибка. Знаки отсчитываются от точки весеннего равноденствия, а она из-за прецессии ползёт по небу на 1° за 72 года; со времён, когда знаки совпадали с созвездиями, она ушла почти на целое созвездие.</p>`}
      <p class="sky-astro">${INFO[id].astro}</p>
      ${today.length ? `<p class="sky-row">Сегодня:</p>${today.map(t => `<p class="sky-today">${t}</p>`).join('')}` : ''}`;
    ui.card.hidden = false;
    ui.card.scrollTop = 0;
    ui.card.querySelector('.sky-card-x').addEventListener('click', closeCard);
  }

  /* ===== ЕЩЁ В КОСМОСЕ: КАРТОЧКА ===== */
  function extraSVG(kind) {
    const f = fillOf, sh = shade('x');
    switch (kind) {
      case 'probe':      // корпус, две панели, тарелка антенны
        return `<svg viewBox="-50 -50 100 100" aria-hidden="true"><rect x="-46" y="-9" width="30" height="18" ${f('--pl-panel')}/><rect x="16" y="-9" width="30" height="18" ${f('--pl-panel')}/>`
          + `<rect x="-16" y="-1" width="32" height="2" ${f('--pl-metal')}/><rect x="-10" y="-12" width="20" height="24" rx="2" ${f('--pl-metal')}/>`
          + `<path d="M-12-14A12 7 0 0 1 12-14Z" ${f('--pl-metal')} opacity=".8"/></svg>`;
      case 'comet': case 'interstellar':
        return `<svg viewBox="-50 -50 100 100" aria-hidden="true"><defs><linearGradient id="g-tail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--comet);stop-opacity:.75"/><stop offset="1" style="stop-color:var(--comet);stop-opacity:0"/></linearGradient></defs>`
          + `<path d="M-26 8L46-30L46-4Z" fill="url(#g-tail)"/><path d="M-26 8L48-18" style="stroke:var(--comet);stroke-opacity:.5" stroke-width="1.2"/><circle cx="-26" cy="8" r="8" ${f('--pl-ice')}/></svg>`;
      case 'meteor':
        return `<svg viewBox="-50 -50 100 100" aria-hidden="true">${[[-30, -34, 18], [-6, -40, 30], [14, -20, 22], [-36, -4, 14]].map(([x, y, l]) =>
          `<path d="M${x} ${y}l${l} ${l}" style="stroke:var(--meteor)" stroke-width="2.5" stroke-linecap="round"/><path d="M${x - l * 0.6} ${y - l * 0.6}l${l * 0.6} ${l * 0.6}" style="stroke:var(--meteor);stroke-opacity:.3" stroke-width="1.5"/>`).join('')}</svg>`;
      case 'dwarf':
        return `<svg viewBox="-50 -50 100 100" aria-hidden="true"><defs>${sh}</defs><circle r="26" ${f('--pl-rock')}/><g ${f('--pl-ice')} opacity=".35"><circle cx="-8" cy="-9" r="7"/><circle cx="10" cy="8" r="5"/></g><circle r="26" fill="url(#sh-x)"/></svg>`;
      default:          // астероид — неровная глыба
        return `<svg viewBox="-50 -50 100 100" aria-hidden="true"><defs>${sh}</defs><path d="M-28-6C-30-20-14-30 2-28c16 2 28 10 26 26-2 14-14 26-30 24-16-2-24-14-26-28z" ${f('--pl-rock')}/>`
          + `<g ${f('--pl-rock-dark')} opacity=".6"><circle cx="-8" cy="-10" r="5"/><circle cx="10" cy="6" r="4"/><circle cx="-12" cy="10" r="3"/></g><path d="M-28-6C-30-20-14-30 2-28c16 2 28 10 26 26-2 14-14 26-30 24-16-2-24-14-26-28z" fill="url(#sh-x)"/></svg>`;
    }
  }
  // чем увидеть: границы — глаз за городом 6m, бинокль 9m, телескоп-любитель 14m
  function seeLine(e) {
    // «Уэбб» отражает много света: любители ловят его в телескоп как еле заметную звёздочку
    if (e.id === 'jwst') return 'Глазом и в бинокль не увидеть. В большие любительские телескопы его ловят как еле заметную звёздочку, которая за ночь смещается среди звёзд.';
    if (e.kind === 'probe') return 'Зонд не увидеть ни глазом, ни в телескоп: он слишком мал и далеко. На карте — точка, где он сейчас.';
    if (e.mag === null) return '';
    const m = e.mag.toFixed(1).replace('.', ',');
    const how = e.mag <= 6 ? '<b>видно глазом</b> в тёмном небе за городом' : e.mag <= 9 ? '<b>видно в бинокль</b>' : e.mag <= 14 ? '<b>видно в телескоп</b>' : '<b>только в большие телескопы</b>';
    return `Блеск ${m}m — ${how}. Чем меньше число, тем ярче; глазом видно примерно до 6m.`;
  }
  function selectExtra(id) {
    selected = id; renderChips();
    const e = frame.extras.find(x => x.id === id); if (!e) return;
    track('sky.body', { body: e.kind });
    const con = constellationAt(e.ra, e.dec);
    const alt = Math.asin(e.v[2]) * R2D, az = ((Math.atan2(e.v[0], e.v[1]) * R2D) + 360) % 360;
    const where = alt < 0 ? '<b>Под горизонтом</b> — сейчас не видно' : `${alt < 12 ? 'Низко над горизонтом' : alt > 60 ? 'Высоко в небе' : 'Над горизонтом'}, ${sideWord(az)}`;
    let sub = KIND[e.kind], body = '';
    if (e.kind === 'meteor') {
      const s = e.shower, dp = daysToPeak(s, new Date());
      const peak = dp === 0 ? '<b>пик — сегодня ночью</b>' : dp > 0 ? `пик — около ${dayMonth(s.peak)}, через ${daysWord(dp)}` : `пик был около ${dayMonth(s.peak)}`;
      sub += ` · до ${dayMonth(s.to)}`;
      body = `<p class="sky-fact">Земля проходит сквозь пыль ${s.parent}. Пылинки сгорают в атмосфере — это и есть «падающие звёзды». Все они летят как будто из одной точки — радианта; он здесь и отмечен.</p>
        <p class="sky-row">Активен с ${dayMonth(s.from)} по ${dayMonth(s.to)}, ${peak}.</p>
        <p class="sky-row">В пик — до <b>${s.zhr}</b> метеоров в час в идеально тёмном небе; в городе — в разы меньше.</p>
        <p class="sky-row">Радиант: ${where[0].toLowerCase() + where.slice(1)}${con ? ` · созвездие <b>${con.ru}</b>` : ''}</p>
        <p class="sky-note">Смотреть лучше после полуночи, вдали от фонарей, не на сам радиант, а в сторону от него: метеоры разлетаются по всему небу.</p>`;
    } else {
      if (e.name && e.kind !== 'probe' && !e.ru.includes(e.name)) sub += ' · ' + e.name.replace(/\s*\(.*\)$/, '');
      const dist = distanceLine(id, e.dist, herOf(e), e.kind === 'probe');
      body = `<p class="sky-fact">${INFO_X[id] || KIND_FACT[e.kind] || ''}</p>
        ${seeLine(e) ? `<p class="sky-row">${seeLine(e)}</p>` : ''}
        ${e.dist ? `<p class="sky-row">${dist}</p>` : ''}
        <p class="sky-row">${where}${con ? ` · созвездие <b>${con.ru}</b>` : ''}</p>
        ${e.kind === 'comet' ? '<p class="sky-note">Блеск комет предсказывают неточно: бывает, что комета вспыхивает в сотни раз или рассыпается. Хвост на карте — направление от Солнца, а не его настоящая длина.</p>' : ''}`;
    }
    ui.card.innerHTML = `
      <div class="sky-card-head"><span class="sky-pic">${extraSVG(e.kind)}</span>
        <div class="sky-card-title"><b>${e.ru}</b><small><i style="color:${KIND_COL[e.kind]}">${KIND_GLYPH[e.kind]}${FE0E}</i> ${sub}</small></div>
        <button class="sky-card-x" type="button" aria-label="Закрыть">×</button></div>
      ${body}`;
    ui.card.hidden = false;
    ui.card.scrollTop = 0;
    ui.card.querySelector('.sky-card-x').addEventListener('click', closeCard);
  }

  /* ===== ПОДСКАЗКИ ===== */
  let hintTimer = 0;
  function say(text, ms) {
    ui.hint.textContent = text; ui.hint.classList.remove('gone');
    clearTimeout(hintTimer); hintTimer = setTimeout(() => ui.hint.classList.add('gone'), ms || 7000);
  }
  ui.hint.addEventListener('click', () => ui.hint.classList.add('gone'));

  /* ===== ЗАПУСК ===== */
  el('back').addEventListener('click', () => { if (history.length > 1) history.back(); else location.href = 'index.html'; });
  resize(); showPlace();
  fetch('sky.json').then(r => r.json()).then(j => { SKY = j; refreshFrames(); renderChips(); })
    .catch(() => say('Не удалось загрузить карту неба.', 10000));
  // без таблицы — просто без слоя «ещё в космосе»: планеты и звёзды важнее
  fetch('bodies.json').then(r => r.json()).then(j => { BODIES = j; refreshFrames(); renderChips(); }).catch(() => {});
  locate(); askPlanets();
  setInterval(askPlanets, 60000);
  setInterval(refreshFrames, 5000);
  setTimeout(() => chooseMode(true), 1500);
  // про прицел — один раз, после подсказки о датчиках
  setTimeout(() => {
    if (store.get('astrolab_sky_aim_hint')) return;
    say('Наведите прицел на планету и подержите — через 3 секунды откроется её карточка.', 8000);
    store.set('astrolab_sky_aim_hint', true);
  }, 11000);
  if (!engine) say('Планеты считаются только в приложении.', 8000);
  requestAnimationFrame(draw);
  // для проверки в браузере без датчиков: ?az=…&alt=…
  const q = new URLSearchParams(location.search);
  if (q.has('az')) { viewAz = +q.get('az'); viewAlt = +(q.get('alt') || 30); }
})();
</script>
</body>
</html>
