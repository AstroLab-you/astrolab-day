<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Полёт к планетам</title>
<!--
  ===== ИГРА «ПОЛЁТ К ПЛАНЕТАМ» =====

  Экран приложения «прогноз на день» (tools/natal-calc/app): шаги
  превращаются в путь корабля от Земли к Плутону. Открывается с экрана
  дня, системная «Назад» возвращает обратно — как у «Неба» (sky.html).

  Правила — не здесь, а в src/game.ts: сборка кладёт их рядом как
  game-rules.js (esbuild), страница только рисует то, что вернул replay().
  Расчёт детерминирован: по шагам за каждый день и выбору на остановках
  корабль всегда оказывается в одном и том же месте, поэтому хранить
  положение не нужно — хранятся шаги по дням и выбор.

  Одиночка — весь в телефоне: шаги, выбор, зерно контейнеров лежат
  в localStorage (astrolab_game) и никуда не уходят. Экипаж живёт на
  сервере (/api/game, backend/src/modules/game): телефон сдаёт туда свои
  шаги по дням и голоса, а забирает шаги корабля, решения и экипаж —
  и считает корабль теми же правилами. Ник и согласие спрашиваются один
  раз, при первом экипаже; дальше игрок — ключ от сервера (save.secret).
  Собрать экипаж — со старта или пересадкой на любой стоянке; сесть —
  по коду друга. Ушёл из экипажа — летит один с того же места
  (leaveSnapshot). В демо экипаж выключен: настоящую базу оно не трогает,
  для проверки — свой сервер в localStorage astrolab_api.

  Откуда шаги: плагин Steps (app/android) — Health Connect за 30 дней
  и свой счётчик телефона, по дню берётся большее. История глубже 30 дней
  копится здесь же: каждый день, который телефон отдал, запоминается.

  Эталон вида — мокапы game-art/mockups/route-mock.html (карта,
  стоянки, развилки, контейнер, туман) и scenes-mock.html (старт,
  прилёт с климатом). Решения Никиты: в тумане никаких значков, на
  закрытом контейнере нет «?» — закрытый ящик сам значит «неизвестно».

  Решения 2026-10-11: герой выбирается целой наклейкой, а не мордочкой
  в кружке; путь на развилке — стрелкой на карте (апгрейд — в панели);
  наклейка климата после прилёта «прилипает» к планете на карте; пока
  копятся шаги на апгрейд, у корабля значок «работы идут» (works.webp);
  подарок из контейнера виден на корабле только после открытия.

  Решения 2026-10-12: «работы идут» — манипулятор со сваркой: стоит на
  краю планеты, головка — на корабле; наклейка климата — на самой
  планете, а не рядом; корабль садится облётом планеты, без скачка;
  стрелка развилки только подсвечивает путь (сначала — прямой), улетают
  или голосуют кнопкой в панели — чтобы случайное касание не решало.
  Карта приближается и отдаляется двумя пальцами; тап по планете или
  базе — её описание. Корабль, достроенный на Земле, взлетает по кнопке
  «Старт!». В бете (сборка для своих) — кнопка «+500 шагов».
  Кружок игры на экране дня заполняется по ring() из правил (src/game.ts).

  Решения 2026-11-22 (после полёта втроём): ник и
  героя можно сменить: «Экипаж» / «Друзья» → «Сменить ник и героя»
  (POST /api/game/me). Код для друзей — только пока есть места; при полном
  корабле вместо него — где впереди ставится каюта на 5 мест. Пока корабль
  строится, панель пишет, сколько шагов осталось до старта: экипаж в сборе
  ещё не летит. У «+500 шагов» — «?» с объяснением.

  Решения 2026-11-22, вечер: у шторок крестик в углу и смахивание вниз
  за полоску, кнопок «Закрыть» нет. Карта не отдаляется мельче 100%.
  Пока корабль строится — на планете этап стройки (каркас, обшивка, почти
  готов), а не полупрозрачный корабль. Аватарки героев — наклейки своей
  формой, без кружка; в иллюминаторе корабля герой по-прежнему в круге.

  Картинки — game/img (свои права, см. game/LICENSE), координаты звёзд
  для мерцания — game/space_dark.json.

  Для проверки в браузере: game.html#demo — шаги выдуманные, старт
  на 25 дней раньше, память отдельная (astrolab_game_demo).
-->
<style>
  /* ===== ПАЛИТРА ===== (как у экрана дня и «Неба») */
  :root {
    --bg:          #1A2036;
    --bg-black:    #0B0E1C;
    --panel:       rgb(26 32 54 / .9);
    --sheet:       rgb(22 27 48 / .97);
    --text:        #F4F1E9;
    --muted:       rgba(244,241,233,0.62);
    --line:        rgba(244,241,233,0.14);
    --tile:        rgba(244,241,233,0.05);
    --tile-line:   rgba(244,241,233,0.12);
    --gold:        #C9A45C;
    --gold-deep:   #B8863B;
    --gold-soft:   #E0C48C;
    --gold-pale:   #F3DDA6;
    --gold-tint:   rgba(224,196,140,0.1);
    --gold-edge:   rgba(224,196,140,0.45);
    --ink:         #4A3426;            /* коричневый контур наклеек */
    --cream:       #FBF1DC;
    --porthole:    #CFE9F7;
    --flame-core:  #FFF6D6;
    --flame-mid:   #FFD36B;
    --flame-edge:  #F08A4B;
    --ion-core:    #FFFFFF;
    --ion-mid:     #B9F2FF;
    --ion-edge:    #9C8CFF;
    --boost:       #FFD36B;
    --banner:      #E0A458;
    --shade:       rgba(0,0,0,0.45);
    --font: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --glow: drop-shadow(0 0 1px var(--gold-pale)) drop-shadow(0 0 1.5px rgb(224 196 140 / .9)) drop-shadow(0 0 9px rgb(224 196 140 / .4));
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); overflow: hidden; user-select: none; -webkit-user-select: none; }
  img { display: block; }
  button { font-family: var(--font); }
  button:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 2px; }

  /* ===== КАРТА ===== вертикальная лента: Земля внизу, Плутон наверху */
  .scroll { position: fixed; inset: 0; overflow: auto; scrollbar-width: none; overscroll-behavior: contain; touch-action: pan-x pan-y;
    background: var(--bg) url(game/img/space_dark.webp) center top repeat; background-attachment: local; }   /* размер — в applyZoom, как у карты */
  .scroll::-webkit-scrollbar { display: none; }
  /* зум: .zoom — место под карту в нынешнем масштабе, сама карта масштабируется целиком */
  .zoom { position: relative; margin: 0 auto; }
  .map { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: var(--bg) url(game/img/space_dark.webp) repeat-y; background-size: 100% auto; }

  /* мерцание: мягкое свечение поверх нарисованных звёзд */
  .tw { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; opacity: 0;
    mix-blend-mode: screen; animation: tw var(--d) ease-in-out var(--delay) infinite; }
  @keyframes tw { 0%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(.8); } 50% { opacity: var(--peak); transform: translate(-50%, -50%) scale(1); } }

  /* туман: размытая копия фона поверх неизведанного; планеты — силуэтами, без подписей, пути и значков */
  .fogbg { position: absolute; left: -30px; right: -30px; top: 0; pointer-events: none;
    background: var(--bg) url(game/img/space_dark.webp) repeat-y; filter: blur(7px) brightness(.72) saturate(.7);
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 160px), transparent);
            mask-image: linear-gradient(to bottom, #000 calc(100% - 160px), transparent);
    transition: height 1.4s ease; }
  .body.fogged img { filter: blur(6px) saturate(.6) !important; opacity: .5; }
  .body.fogged .label, .body.fogged .badge { display: none; }
  path.fogged { opacity: 0; }

  .route { position: absolute; left: 0; top: 0; width: 100%; overflow: visible; }
  .route path { fill: none; stroke-width: 3; stroke-linecap: round; transition: opacity .8s; }
  .route .done { stroke: var(--gold-soft); }
  .route .ahead { stroke: rgb(224 196 140 / .55); stroke-dasharray: 2 10; }
  .route .hook { stroke-width: 2.4; }

  .body { position: absolute; transform: translate(-50%, -50%); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .body img { width: 100%; height: auto; filter: var(--glow); transition: filter .8s, opacity .8s; }
  .label { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 4px); white-space: nowrap; font: 700 11px var(--font); letter-spacing: .04em;
    padding: 2px 9px; border-radius: 99px; background: rgb(26 32 54 / .8); color: var(--text); border: 1px solid rgb(224 196 140 / .35); }
  .body.base .label { font-size: 10px; }
  .body.arrived::after { content: ''; position: absolute; inset: -8%; border-radius: 50%; border: 2px solid var(--gold-soft); opacity: 0;
    animation: ring 1.8s ease-out 2; pointer-events: none; }
  @keyframes ring { 0% { opacity: .9; transform: scale(.9); } 100% { opacity: 0; transform: scale(1.6); } }
  .badge { position: absolute; right: -10px; top: -12px; z-index: 1; filter: drop-shadow(0 2px 4px var(--shade)); }
  .badge .dot { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--gold-soft); }

  /* наклейка климата: после прилёта «прилипает» прямо на планету, как на чемодан */
  .body .souv { position: absolute; top: 44%; width: 46%; z-index: 1; filter: drop-shadow(0 2px 3px var(--shade)); transform: rotate(var(--rot)); }
  .body .souv.slap { animation: slap .7s cubic-bezier(.3, 1.6, .5, 1) both; }
  @keyframes slap { 0% { opacity: 0; transform: scale(2.6) rotate(calc(var(--rot) * -2)); } 60% { opacity: 1; } 100% { transform: scale(1) rotate(var(--rot)); } }
  .body.fogged .souv { display: none; }

  /* развилка: две стрелки на путях от планеты, выбранная — золотая */
  .fork { all: unset; position: absolute; z-index: 3; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 4px; cursor: pointer; }
  .fork:focus-visible .arr { outline: 2px solid var(--gold-pale); outline-offset: 3px; }
  .fork .arr { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: rgb(26 32 54 / .85);
    border: 2px solid var(--gold-edge); box-shadow: 0 0 14px rgb(224 196 140 / .35); }
  .fork .arr svg { width: 26px; height: 26px; transform: rotate(var(--ang)); }
  .fork .arr path { fill: none; stroke: var(--gold-pale); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .fork.ask .arr { animation: ask 1.3s ease-in-out infinite; }
  @keyframes ask { 50% { box-shadow: 0 0 24px rgb(243 221 166 / .8); transform: scale(1.1); } }
  .fork.on .arr { background: linear-gradient(135deg, var(--gold-deep), var(--gold-soft)); border-color: var(--gold-pale); }
  .fork.on .arr path { stroke: var(--bg); }
  .fork.off { opacity: .55; }
  .route path.dim { opacity: .2; }
  .route path.pick { stroke: var(--gold-pale); stroke-dasharray: 7 7; opacity: 1; filter: drop-shadow(0 0 4px rgb(243 221 166 / .7)); }
  .hud .cta { padding: 10px; }

  /* работы идут: манипулятор стоит на планете у корабля и варит его, пока копятся шаги на апгрейд.
     Обёртка — точка основания на краю планеты, качается вокруг неё; картинка смотрит головкой на корабль */
  .works { position: absolute; z-index: 3; width: 0; height: 0; pointer-events: none; animation: tinker 1.6s ease-in-out infinite; }
  .works img { position: absolute; bottom: 0; filter: var(--glow); }
  @keyframes tinker { 0%, 100% { rotate: 0deg; } 50% { rotate: var(--sway, -5deg); } }
  .hud .wk { display: inline-block; width: 22px; vertical-align: -5px; margin-right: 4px; }

  /* ===== КОРАБЛЬ ===== корпус + двигатель за ним + модули за ним; пламя и покачивание кодом */
  .ship { position: absolute; transform: translate(-50%, -50%) rotate(var(--ang, 0deg)) scale(var(--sc, 1)); z-index: 2; pointer-events: none; }
  .ship.glide { transition: left .9s ease, top .9s ease, transform .9s ease; }
  .ship .bob { animation: bob 2.6s ease-in-out infinite; }
  .ship.landed .bob { animation: none; }
  /* стройка: вместо корабля — его этап (каркас, обшивка, почти готов), по доле собранных шагов */
  /* крупнее корабля (62): у этапа леса и кран, и вдвое уменьшенный на стоянке, он должен читаться */
  .ship .stage { width: 84px; filter: var(--glow); }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  .rig { position: relative; isolation: isolate; display: grid; justify-items: center; width: var(--w, 62px); }
  .rig img { width: 100%; height: auto; }
  /* слои снизу вверх: свечение (копия корпуса с двигателем) → бак и радар → корпус с двигателем */
  .rig .core { position: relative; z-index: 2; display: grid; justify-items: center; width: 100%; }
  .rig .halo { position: absolute; left: 0; top: 0; z-index: 0; filter: var(--glow); }
  .rig .hullbox { position: relative; width: 100%; z-index: 2; }
  .rig .eng { position: relative; z-index: 1; width: 40%; margin-top: -9%; }
  .rig .flames { display: flex; justify-content: center; gap: calc(var(--w) * .07); width: 100%; position: relative; z-index: 0; }
  .rig .flames .flame { width: calc(var(--w) * .13 * var(--f, 1)); }
  .rig .flame { position: relative; z-index: 0; width: calc(22% * var(--f, 1)); aspect-ratio: 1 / 1.7; margin-top: -3%; border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%;
    background: radial-gradient(ellipse at 50% 25%, var(--flame-core) 0 25%, var(--flame-mid) 45%, var(--flame-edge) 75%, transparent 76%);
    transform-origin: 50% 0; animation: flame .18s ease-in-out infinite alternate; transition: opacity .5s; }
  .rig .flame.ion { background: radial-gradient(ellipse at 50% 25%, var(--ion-core) 0 22%, var(--ion-mid) 42%, var(--ion-edge) 72%, transparent 74%); }
  .ship.landed .flame, .ship.landed .trail { opacity: 0; }
  @keyframes flame { from { transform: scaleY(.85) scaleX(1.05); } to { transform: scaleY(1.12) scaleX(.94); } }
  .rig .mod { position: absolute; z-index: 1; }
  .rig .tank { left: -22%; top: 24%; width: 34%; }
  .rig .tank.big { left: -30%; top: 16%; width: 44%; }
  .rig .radar { right: -26%; top: 2%; width: 40%; }
  /* разгон из контейнера: пламя длиннее, за кораблём золотой след */
  .rig.boost .flame { width: calc(22% * var(--f, 1) * 1.45); filter: drop-shadow(0 0 6px var(--boost)); }
  .rig .trail { position: relative; z-index: -1; width: 14%; height: calc(var(--w) * 1.2); margin-top: -12%; border-radius: 99px;
    background: linear-gradient(rgb(255 211 107 / .75), rgb(240 138 75 / .25) 55%, transparent); filter: blur(2px); }
  /* иллюминатор: круг поверх стекла, в нём мордочка героя */
  .port { position: absolute; transform: translate(-50%, -50%); aspect-ratio: 1; border-radius: 50%; overflow: hidden; background: var(--porthole); }
  /* герой целиком, чуть крупнее круга: углы картинки срезает круг, а мордочка
     остаётся в центре у всех зверей — прежнее увеличение со сдвигом вниз
     у тюленя и крокодила срезало морду, у остальных оставляло макушку */
  .port img { width: 100%; height: 100%; object-fit: contain; transform: scale(1.15); }

  /* контейнер базы и значок разгона */
  .crate { display: block; filter: var(--glow); }
  .crate.open { animation: glowup 1.6s ease-in-out infinite; }
  @keyframes glowup { 50% { filter: var(--glow) drop-shadow(0 -6px 12px rgb(255 231 160 / .55)); } }
  .bst { position: relative; display: inline-block; width: var(--w); }
  .bst img { width: 100%; }
  .bst b { position: absolute; right: -14%; bottom: -6%; font: 800 calc(var(--w) * .32)/1 var(--font); color: var(--gold-pale);
    -webkit-text-stroke: 1px var(--ink); paint-order: stroke; text-shadow: 0 1px 2px var(--shade); }

  /* ===== ВЕРХ: назад и подсказки ===== */
  .back { position: fixed; left: 10px; top: calc(10px + env(safe-area-inset-top)); z-index: 10; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--line); background: rgb(26 32 54 / .8); color: var(--text); cursor: pointer; display: grid; place-items: center; padding: 0; }
  .back svg { width: 20px; height: 20px; margin-left: -2px; }   /* оптический центр: у шеврона вес слева */
  .toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translate(-50%, -20px); opacity: 0; z-index: 9; pointer-events: none;
    font: 800 14px var(--font); color: var(--bg); background: linear-gradient(90deg, var(--gold-soft), var(--gold-pale)); padding: 8px 16px; border-radius: 99px;
    box-shadow: 0 0 18px rgb(224 196 140 / .6); transition: opacity .4s, transform .4s; white-space: nowrap; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  /* только в #demo: прибавить дней, чтобы пролететь дальше */
  .demo { position: fixed; right: 10px; top: calc(58px + env(safe-area-inset-top)); z-index: 10; padding: 9px 14px; border-radius: 99px; cursor: pointer;
    border: 1px solid var(--gold-edge); background: rgb(26 32 54 / .85); color: var(--gold-pale); font: 700 13px var(--font); }
  .scene:not([hidden]) ~ .demo { display: none; }
  .betabox { display: flex; gap: 6px; padding: 0; border: 0; background: none; }
  .betabox[hidden] { display: none; }
  .betabox button { all: unset; cursor: pointer; padding: 9px 14px; border-radius: 99px; border: 1px solid var(--gold-edge); background: rgb(26 32 54 / .85); color: var(--gold-pale); font: 700 13px var(--font); }
  .betabox #plus-info { width: 34px; padding: 9px 0; text-align: center; }
  .betabox button:focus-visible { outline: 2px solid var(--gold-pale); outline-offset: 2px; }   /* на сценах (старт, прилёт) кнопки беты не мешают заголовку */

  /* ===== ПАНЕЛЬ ВНИЗУ ===== */
  .hud { all: unset; box-sizing: border-box; position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 4;
    border-radius: 20px; padding: 12px 14px; display: grid; gap: 8px; max-width: 520px; margin: 0 auto;
    background: var(--panel); border: 1px solid var(--line); color: var(--text); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .hud.tap { cursor: pointer; }
  .hud .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .hud .leg { font-weight: 800; font-size: 14px; }
  .hud .pct { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px; opacity: .8; }
  .hud .boost { color: var(--boost); font-weight: 800; }
  .hud .steps { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  .hud .note { font-size: 12px; color: var(--gold-soft); }
  .bar { height: 8px; border-radius: 99px; overflow: hidden; background: var(--tile-line); }
  .bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--gold-deep), var(--gold-soft)); transition: width .6s; }
  /* аватарка — наклейка героя своей формой, как он нарисован, без кружка (решение 2026-11-22) */
  .ava { width: 34px; height: 34px; flex: none; }
  .ava img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 1px var(--gold-pale)) drop-shadow(0 0 1px rgb(224 196 140 / .9)); }

  /* ===== СТОЯНКА ===== нижняя панель: что улучшаем и куда летим */
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; max-width: 560px; margin: 0 auto; max-height: 80%; overflow-y: auto;
    border-radius: 24px 24px 0 0; padding: 16px 14px calc(14px + env(safe-area-inset-bottom)); display: grid; gap: 12px; color: var(--text);

// Одиночка живёт в телефоне целиком. Экипаж — на сервере (/api/game,

const API = (() => { try { return localStorage.getItem('astrolab_api'); } catch (e) { return null; } })() || 'https://astrolab.you/api';
// демо в браузере в настоящую базу не пишет: экипаж в нём — только с явно указанным своим сервером

const BACKFILL = 8;          // сколько дней назад сервер принимает шаги (BACKFILL_DAYS)
async function api(method, path, body) {
  const headers = {};
  if (body) headers['content-type'] = 'application/json';
  if (save.secret) headers.authorization = 'Bearer ' + save.secret;
  let r;
  try { r = await fetch(API + '/game' + path, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' }); }
  catch (e) { throw Object.assign(new Error('Нет связи с сервером'), { code: 'offline' }); }
  const j = r.status === 204 ? {} : await r.json().catch(() => ({}));

    const h = {};

    p.done.style.strokeDasharray = `${len} ${p.L}`;
  }
  // туман: видно следующую остановку, с радаром — ещё одну
  const visible = S.visible;
  bodies.forEach((el, i) => el.classList.toggle('fogged', i > visible));
  for (let i = 0; i < FINAL; i++) paths['leg' + i].ahead.classList.toggle('fogged', i >= visible);
  for (const i in BASES) {
    const fog = +i > visible - 1;
    baseEls[i].classList.toggle('fogged', fog);
    ['out', 'in'].forEach(x => paths[x + i].ahead.classList.toggle('fogged', fog));
    // значок у базы: закрытый контейнер, с радаром — что внутри; после стыковки пропадает
    const badge = baseEls[i].querySelector('.badge');
    badge.innerHTML = S.gifts[i] || +i < k ? '' : S.radar ? `<div class="dot">${giftPic(gift(G.seed, +i, S), S, 22)}</div>` : crate(false, 28);
  }
  const fogEnd = visible >= FINAL ? 0 : pt(visible).y - 150;
  fogbg.style.height = fogEnd > 0 ? (fogEnd + 160) + 'px' : '0px';

  // корабль: на остановке — вдвое меньше, на макушке планеты
  let x, y, ang, sc;
  if (here) ({ x, y, ang, sc } = flyPos(here.key, here.t));
  else { const p = pt(k); x = p.x; y = p.y - STOPS[k][2] / 2 - 22; ang = 0; sc = .5; }
  shipEl.style.left = x + 'px'; shipEl.style.top = y + 'px';
  shipEl.style.setProperty('--ang', ang.toFixed(1) + 'deg');
  shipEl.style.setProperty('--sc', sc.toFixed(3));
  if (follow) {
    scroll.scrollTop = y * Z - scroll.clientHeight * (here ? 0.45 : 0.3);
    if (Z > 1) scroll.scrollLeft = x * Z + zoomEl.offsetLeft - scroll.clientWidth / 2;
  }

  // наклейки климата — у планет, где игрок уже видел прилёт
  for (const [i, el] of Object.entries(souvs)) el.hidden = !(+i <= G.seen.stop && +i <= k);
  // работы идут: на стоянке выбран апгрейд, шаги на него ещё копятся
  const picked = !here && S.phase === 'stop' && k === S.stop ? G.choices[k] : null;
  worksEl.hidden = !(picked && picked !== 'skip' && picked !== 'solo' && picked !== 'crew');
  if (!worksEl.hidden) {
    // основание — на краю диска с внешней стороны, головка со сваркой — на корабле
    const p = pt(k), r = STOPS[k][2] / 2 * .84, out = XS[k] < .5 ? -1 : 1, dx = 24, w = 50, img = worksEl.firstChild;
    worksEl.style.left = (p.x + out * dx) + 'px';
    worksEl.style.top = (p.y - Math.sqrt(r * r - dx * dx) + 5) + 'px';
    worksEl.style.setProperty('--sway', (out * 5) + 'deg');
    img.style.width = w + 'px';
    img.style.left = (out < 0 ? -.3 : -.7) * w + 'px';
    img.style.transform = out < 0 ? '' : 'scaleX(-1)';
  }
  paintFork(here ? -1 : k);
}

// ===== РАЗВИЛКА НА КАРТЕ =====
// На планете с базой путь выбирают стрелкой прямо на карте: прямо к следующей
// планете или крюком к базе. Сначала — апгрейд в панели снизу, потом стрелка:
// выбранный апгрейд ждёт в pendingUp, путь — в pickWay (сначала подсвечен
// прямой). Стрелка только подсвечивает путь, а улетаем по кнопке в панели:
// случайное касание не должно решать за игрока. В память (или голосом на
// сервер) апгрейд и путь уходят вместе. Одиночка, пока копит шаги на апгрейд,
// может стрелку переключить; экипаж голосует, и решённое уже не меняется.
let pendingUp = null, pickWay = null;
const face = hero => `<div class="ava"><img src="${IMG}hero_${hero}.webp" alt="${HEROES[hero] || ''}"></div>`;
// голоса экипажа на этой остановке и свой среди них
const votesAt = k => G.crewMode ? G.ship.votes.filter(v => v.stop === k && G.ship.crew[v.voter]) : [];
const myVote = k => votesAt(k).find(v => G.ship.crew[v.voter].me);
const voters = (k, test) => votesAt(k).filter(test).map(v => face(G.ship.crew[v.voter].hero)).join('');

function paintFork(k) {
  forkEls.forEach(el => el.remove()); forkEls = [];
  if (!(k in BASES) || S.phase !== 'stop' || S.stop !== k || busy) { unpaintFork(); return; }
  const decided = !!G.choices[k], base = BASE_NAME[BASES[k]], mine = myVote(k);
  // подписей у стрелок нет: каждая указывает на подписанную цель, у базы — значок контейнера
  const ways = [{ hook: false, at: onPath('leg' + k, .5) }, { hook: true, at: onPath('out' + k, .55) }];
  for (const w of ways) {
    const el = document.createElement('button');
    const picking = !decided && pendingUp, on = decided ? hooked(k) === w.hook : picking ? pickWay === w.hook : !!mine && mine.hook === w.hook;
    el.type = 'button';
    el.setAttribute('aria-pressed', on);
    el.className = 'fork' + (on ? ' on' : picking ? ' ask' : decided || mine ? ' off' : '');
    el.setAttribute('aria-label', w.hook ? `Крюк к базе ${base}: +30% пути, бак доверху и контейнер` : `Прямо: ${STOPS[k + 1][1]}`);
    el.style.left = w.at.x + 'px'; el.style.top = w.at.y + 'px';
    el.innerHTML = `<span class="arr"><svg viewBox="0 0 24 24" aria-hidden="true" style="--ang:${w.at.ang.toFixed(1)}deg"><path d="M12 20 V5 M5 11 L12 4 L19 11"/></svg></span>` +
      (decided ? '' : `<span class="who">${voters(k, v => v.hook === w.hook)}</span>`);
    el.addEventListener('click', () => chooseWay(k, w.hook));
    map.appendChild(el); forkEls.push(el);
  }
  // невыбранный путь тускнеет, подсвеченный до решения — светится
  const way = decided ? hooked(k) : pendingUp ? pickWay : null;
  paths['leg' + k].ahead.classList.toggle('dim', way === true);
  ['out', 'in'].forEach(x => paths[x + k].ahead.classList.toggle('dim', way === false));
  paths['leg' + k].ahead.classList.toggle('pick', !decided && way === false);
  ['out', 'in'].forEach(x => paths[x + k].ahead.classList.toggle('pick', !decided && way === true));
}
// стрелок нет — подсвечивать нечего (тусклый невыбранный путь остаётся)
function unpaintFork() {
  for (const p of Object.values(paths)) p.ahead.classList.remove('pick');
}
// стрелка: до решения — подсветить путь; одиночке, который копит на апгрейд, — сменить путь
function chooseWay(k, hook) {
  if (busy) return;
  if (G.crewMode && G.choices[k]) { toast('Экипаж уже выбрал путь'); return; }
  if (!pendingUp && G.crewMode) pendingUp = (myVote(k) || {}).choice || null;   // передумать с голосом
  if (!pendingUp && !G.choices[k]) { pickWay = hook; openStop(); return; }  // сначала — что улучшаем
  if (pendingUp) { pickWay = hook; paintHud(); render(shown, false); return; }
  // корабль стоит, пока копит шаги на апгрейд, — путь можно сменить сразу
  save.hooks[k] = hook; persist();
  toast(hook ? `Летим через базу ${BASE_NAME[BASES[k]]}` : `Летим прямо: ${STOPS[k + 1][1]}`);
  refresh(false);
}
// кнопка в панели: подсвеченный путь решён
function commitWay(k) {
  const hook = !!pickWay, c = pendingUp;
  if (G.crewMode) { sendVote(k, c, hook); return; }
  if (c === 'crew') { crewProfile('ship', null, null, hook); return; }
  save.choices[k] = c; save.hooks[k] = hook;
  pendingUp = null; pickWay = null;
  persist();
  toast(hook ? `Летим через базу ${BASE_NAME[BASES[k]]}` : `Летим прямо: ${STOPS[k + 1][1]}`);
  refresh(false);
}
// голос экипажа: апгрейд и у развилки — путь; ответ сервера — свежий корабль
async function sendVote(k, choice, hook) {
  try {
    const v = await api('POST', '/choice', { stop: k, choice, hook: !!hook });
    save.crew.view = v; persist();
    pendingUp = null; pickWay = null;
    toast(v.ship.choices[k] ? 'Экипаж решил!' : 'Голос принят');
  } catch (e) { toast(e.message); }
  refresh(false);
}

// ===== ПАНЕЛЬ ВНИЗУ =====
const hud = document.getElementById('hud');
function legName(u) {

}
const UP_NAME = { engine: 'двигатель', cabin: 'каюту', tank: 'бак', radar: 'радар', crew: 'корабль на троих', solo: 'корабль' };
function paintHud() {

    pct = Math.floor(f * 100) + '%'; bar = f;

    if (d != null) note = d < 1 ? 'долетим сегодня-завтра' : `≈ ${Math.ceil(d)} ${daysWord(Math.ceil(d))} до ${S.hook && !S.docked ? 'базы' : 'посадки'}`;

    pct = `${fmt(S.paid)} из ${fmt(cost)}`; bar = cost ? S.paid / cost : 1;

    // экипаж в сборе ещё не значит «летим»: корабль на троих стартует, когда шагов хватит
    const left = Math.max(0, cost - S.paid);

      : G.crewMode ? 'Экипаж решил. Готово — сразу в путь' : k in BASES ? 'Путь можно сменить стрелкой на карте' : 'Нажмите, чтобы передумать';
  } else if (G.crewMode) {
    const vs = votesAt(k), mine = myVote(k);
    title = `Голосуем: ${STOPS[k][1]}`; pct = `${vs.length} из ${G.ship.crew.length}`; bar = vs.length / G.ship.crew.length;
    note = pendingUp ? 'Другой путь — стрелкой на карте'
      : mine ? 'Ваш голос принят. Решает большинство, молчащих ждём сутки' : 'Нажмите, чтобы проголосовать';
  }
  else if (pendingUp) { title = `Развилка: ${STOPS[k][1]}`; note = 'Другой путь — стрелкой на карте'; }
  else { title = `Стоянка: ${STOPS[k][1]}`; note = 'Нажмите, чтобы выбрать улучшение'; }
  if (stepsState === 'web') note = 'Шаги считаются только в приложении';
  else if (stepsState === 'denied') note = 'Нет доступа к шагам: разрешите его на экране дня, в меню «Шаги за сегодня»';
  else if (stepsState === 'none') note = 'В этом телефоне нет счётчика шагов';
  else if (G.crewMode && offline) note = 'Нет связи с сервером: показан корабль, каким он был';
  // развилка: путь подсвечен, решаем кнопкой
  const go = pendingUp && S.phase === 'stop' && k in BASES ? (pendingUp === 'crew' ? 'Собрать экипаж' : G.crewMode ? 'Голосую' : 'Летим')
    + (pickWay ? `: через базу ${BASE_NAME[BASES[k]]}` : `: прямо, ${STOPS[k + 1][1]}`) : '';
  hud.classList.toggle('tap', canPick());
  hud.innerHTML = `<div class="row"><span class="leg">${title}</span><span class="pct">${pct}</span></div>
    ${go ? `<button type="button" class="cta" id="way">${go}</button>` : `<div class="bar"><i style="width:${Math.min(1, bar) * 100}%"></i></div>`}
    <div class="row"><div class="faces">${G.crew.map(face).join('')}</div>
      <span class="steps">сегодня ${fmt(now)} ${stepsWord(now)}${note ? `<br><span class="note">${note}</span>` : ''}</span></div>`;
  const wb = hud.querySelector('#way');
  if (wb) wb.addEventListener('click', e => { e.stopPropagation(); if (!busy) commitWay(k); });

}
// панель открывает выбор, пока он возможен: у одиночки — до вылета, у экипажа — до решения
const canPick = () => !!S && S.phase === 'stop' && S.stop > 0 && (!G.crewMode || !G.choices[S.stop]);
hud.addEventListener('click', () => { if (canPick() && !busy) openStop(); });

let toastT;
function toast(text) {

// ===== СТОЯНКА =====
const sheet = document.getElementById('sheet');
const closeSheet = () => sheet.classList.remove('on');

// ===== ШТОРКА: КРЕСТИК И СМАХИВАНИЕ ===== (решение 2026-11-22)
// Наверху шторки — полоска и крестик в углу; потянуть полоску вниз — тоже закрыть.
// Закрыть = как «Отмена», если она есть (у ника и согласия она сбрасывает
// выбранный апгрейд). Стыковку с базой не закрыть: без открытого контейнера
// полёт дальше не пойдёт — у неё нет крестика, и смахивание её не трогает.
const SHEET_TOP = '<div class="grab"></div><button type="button" class="sheet-x" aria-label="Закрыть">×</button>';
function dismiss() {
  const no = sheet.querySelector('#no');
  if (no) no.click(); else closeSheet();
}
sheet.addEventListener('click', e => { if (e.target.closest('.sheet-x')) dismiss(); });
let drag = null;
sheet.addEventListener('touchstart', e => {
  const y = e.touches[0].clientY;
  if (e.touches.length !== 1 || !sheet.querySelector('.sheet-x') || sheet.scrollTop > 0 || e.target.closest('button, input, a, label')) return;
  if (y - sheet.getBoundingClientRect().top > 48) return;   // тянуть — за верх шторки, где полоска
  drag = { y0: y, t0: e.timeStamp, dy: 0 };

}, { passive: true });
sheet.addEventListener('touchmove', e => {
  if (!drag) return;
  e.preventDefault();
  drag.dy = Math.max(0, e.touches[0].clientY - drag.y0);

}, { passive: false });
function endDrag(e) {
  if (!drag) return;
  const { dy, t0 } = drag, fast = dy > 30 && dy / Math.max(1, e.timeStamp - t0) > .5;
  drag = null;
  sheet.classList.remove('drag');
  // закрылась — уезжает вниз с того места, где её отпустили; нет — возвращается

}
sheet.addEventListener('touchend', endDrag);
sheet.addEventListener('touchcancel', endDrag);

function upgradeTile(o) {

  if (o.choice === 'engine') return { pic: rig({ ...s, engine: S.engine + 1, w: 34, flame: 0 }), name: 'Двигатель: ' + ENGINES[S.engine], sub: 'вдвое быстрее' };

function openStop() {

      <button type="button" class="cta" id="go">${way ? 'Дальше: куда летим?' : c === 'crew' ? 'Собрать экипаж' : crew ? 'Голосую' : fork ? 'Готово' : 'В путь: ' + STOPS[i + 1][1]}</button>`;

// мест нет: где впереди можно поставить каюту на 5 мест (MENU) — тогда код снова появится
function cabinNote(seats) {
  if (seats >= 5) return 'Мест больше нет: корабль на 5 мест — самый большой.';
  const at = Object.keys(MENU).map(Number).filter(i => i > S.stop && MENU[i].includes('cabin')).sort((a, b) => a - b);
  if (!at.length) return 'Мест больше нет, и каюту на 5 мест впереди уже не поставить.';
  const names = at.map(i => STOPS[i][1]);
  const list = names.length > 1 ? names.slice(0, -1).join(', ') + ' или ' + names.at(-1) : names[0];
  return `Мест больше нет. Каюту на 5 мест экипаж может выбрать на стоянке: ${list} — тогда позовёте ещё двоих, и код для друзей появится здесь.`;
}

// ушёл (или сервер больше не знает игрока): дальше одиночка с того же места.
// Сегодняшние шаги уже ушли экипажу — свои начнутся с завтрашних.
function becomeSolo(snap) {
  save.snap = snap; save.start = shift(today(), 1);
  save.choices = {}; save.hooks = {}; save.steps = {};
  save.seed = save.seed || newSeed();
  const u = snap.flown !== undefined ? snap.stop + snap.flown / legLength(snap.stop, !!snap.hook) : snap.stop;
  save.seen = { u, stop: snap.stop, gifts: {} };
  save.crew = null; pendingUp = null; pickWay = null; persist();
  refresh(true);
}
async function leaveCrew() {
  closeSheet();
  const snap = leaveSnapshot(S, G.ship.crew.length);

// Ник и согласие — один раз, при первом экипаже. Дальше сервер узнаёт игрока по ключу.
// what: 'ship' — строим корабль (с Земли или пересадкой), code — сесть по коду
function crewProfile(what, code, preview, hook) {
  const go = async (profile) => {
    const body = { today: today(), ...profile };
    try {
      let v;
      if (what === 'ship') {
        // пересадка: снимок одиночки на планете; сегодняшние шаги пойдут экипажу, из снимка их убираем
        if (S && S.stop > 0) {
          const snap = snapshot(S), todays = split(save.steps[today()] || 0).counted;
          body.start = { ...snap, tank: Math.floor(snap.tank), credit: Math.max(0, Math.floor(snap.credit - todays)) };
          if (hook) body.hook = true;
        }
        v = await api('POST', '/ships', body);
      } else v = await api('POST', '/join', { ...body, code });
      if (v.secret) save.secret = v.secret;
      if (v.me && v.me.hero !== save.hero) await api('POST', '/me', { hero: save.hero }).catch(() => {});
      save.crew = { view: { me: v.me, ship: v.ship }, seen: null };
      pendingUp = null; pickWay = null;
      closeSheet(); scene.hidden = true;
      // свежий корабль — с уже сданными сегодняшними шагами
      await syncCrew(phone);
      refresh(true);
      if (what === 'ship') setTimeout(openCrew, 1200);
      else toast('Вы на борту!');
    } catch (e) { const er = sheet.querySelector('.err'); if (er) er.textContent = e.message; else toast(e.message); }
  };
  if (save.secret) { go({}); return; }   // ключ уже есть: ник и согласие даны раньше
  sheet.innerHTML = `${SHEET_TOP}
    <div class="head">${preview || rig({ seats: 3, crew: [save.hero], w: 54, flame: 0 })}<div><h4>${what === 'ship' ? 'Собираем экипаж' : 'Садимся на борт'}</h4>
      <p>Друзья увидят ваш ник, героя и шаги по дням.</p></div></div>
    <label class="field">Ник в экипаже<input id="nick" maxlength="20" autocomplete="nickname" value="${esc(save.nick)}" placeholder="Например, Звёздный"></label>
    <label class="agree"><input type="checkbox" id="ok"><span>Согласен передать Astrolab ник, героя и число шагов за день — чтобы сложить их с шагами экипажа.
      Шаги по дням видит только экипаж, через 30 дней они сворачиваются в общий путь корабля.
      <a href="https://astrolab.you/privacy.html" target="_blank" rel="noopener">Политика конфиденциальности, п. 3.6</a></span></label>
    <div class="err" role="alert"></div>
    <button type="button" class="cta" id="go" disabled>${what === 'ship' ? 'Строить корабль на троих' : 'Сесть на борт'}</button>
    <button type="button" class="cta ghost" id="no">Отмена</button>`;
  const nick = sheet.querySelector('#nick'), ok = sheet.querySelector('#ok'), btn = sheet.querySelector('#go');
  const valid = () => /^[\p{L}\p{N}][\p{L}\p{N} ._-]*$/u.test(nick.value.trim()) && ok.checked;
  const upd = () => { btn.disabled = !valid(); };
  nick.addEventListener('input', upd); ok.addEventListener('change', upd);
  btn.addEventListener('click', () => {
    if (!valid()) return;
    save.nick = nick.value.trim(); persist();
    btn.disabled = true;
    go({ nickname: save.nick, hero: save.hero, consent: true }).finally(upd);
  });
  sheet.querySelector('#no').addEventListener('click', () => { pendingUp = null; pickWay = null; closeSheet(); paintHud(); render(shown, false); });
  sheet.classList.add('on');
}

// код друга → кто зовёт → ник и согласие → на борт
function joinByCode(fromSolo) {
  sheet.innerHTML = `${SHEET_TOP}
    <div class="head">${rig({ seats: 3, crew: [save.hero], w: 54, flame: 0 })}<div><h4>Код друга</h4>
      <p>${fromSolo && save.start ? 'Свой одноместный корабль останется: в экипаже вы полетите с друзьями с их места.' : '8 букв и цифр из приглашения.'}</p></div></div>

      sheet.innerHTML = `${SHEET_TOP}
        <div class="head">${pic}<div><h4>Зовут на корабль</h4><p>На борту: ${p.crew.map(c => esc(c.nickname)).join(', ')}. Свободно мест: ${p.seats - p.crew.length}.</p></div></div>
        <div class="err" role="alert"></div>
        <button type="button" class="cta" id="yes">Лечу с ними</button><button type="button" class="cta ghost" id="no">Отмена</button>`;

// Сдать свои шаги и забрать корабль. Без сети — корабль, каким он был.
async function syncCrew(h) {
  offline = false;
  const sh = save.crew.view && save.crew.view.ship;
  if (sh) {
    let from = shift(today(), -BACKFILL);
    if (sh.joinedOn > from) from = sh.joinedOn;
    if (sh.startDay > from) from = sh.startDay;
    const days = Object.keys(h).filter(d => d >= from && d <= today()).sort().slice(-9)
      .map(day => ({ day, steps: Math.min(100000, Math.round(h[day])) }));
    if (days.length) await api('POST', '/steps', { days }).catch(() => {});
  }
  try {
    const v = await api('GET', '/ship');
    if (!v.ship) {
      // сервер больше не держит нас в экипаже (удалили данные, убрали заброшенный корабль)
      const old = save.crew.view && save.crew.view.ship;
      if (old && S && G && G.crewMode) { const snap = leaveSnapshot(S, old.crew.length); save.crew = null; becomeSoloLater = snap; }
      else save.crew = null;
    } else save.crew.view = v;
  } catch (e) {
    offline = e.code === 'offline' || e.status >= 500;
    if (e.status === 401) { save.secret = null; save.crew = null; }
  }
  persist();
}
let becomeSoloLater = null;

          : `<div><b>Что внутри — неизвестно</b><span>Двигатель, бак, радар или разгон. Заранее видно только с радаром.</span></div>`}</div>

const scene = document.getElementById('scene');
const R = (a, b) => a + Math.random() * (b - a);
const many = (n, f) => Array.from({ length: n }, (_, k) => f(k)).join('');
const BOLT = '<svg viewBox="0 0 30 60" aria-hidden="true"><path d="M18 2 L6 32 H15 L10 58 L26 22 H16 Z" fill="#FFF3B0" stroke="#4A3426" stroke-width="2.5" stroke-linejoin="round"/></svg>';
function weather(key) {
  switch (key) {
    case 'moon': return `<img class="abs sticker" src="${IMG}earth.webp" alt="" style="width:20%;left:72%;top:7%">`;
    case 'venus': return '<i class="tint" style="background:rgb(240 200 110 / .12)"></i>' +
      many(3, k => `<i class="haze" style="left:${R(-30, 30)}%;top:${10 + k * 22}%;--dx:${R(-20, 20)}cqw;--d:${-R(0, 12)}s"></i>`) + '<i class="heat"></i>';
    case 'mercury': return '<i class="sun"></i><i class="heat"></i>';
    case 'mars': return '<i class="tint" style="background:rgb(200 100 60 / .12)"></i>' +
      many(46, () => `<i class="dust" style="top:${R(5, 95)}%;--s:${R(3, 7)}px;--t:${R(2.5, 5)}s;--d:${-R(0, 5)}s;--dy:${R(-30, 30)}px"></i>`);
    case 'ceres': return many(26, () => `<i class="rise" style="left:${R(25, 75)}%;--s:${R(3, 6)}px;--t:${R(4, 8)}s;--d:${-R(0, 8)}s;--dx:${R(-40, 40)}px"></i>`);
    case 'jupiter': return `<i class="flash" style="--d:-1s"></i><i class="bolt" style="left:16%;top:20%;--d:-1s">${BOLT}</i>` +
      `<i class="bolt" style="left:68%;top:30%;--d:-2.6s;transform:scaleX(-1)">${BOLT}</i>`;
    case 'saturn': return many(30, () => `<i class="ice" style="left:${R(4, 92)}%;top:${R(4, 70)}%;--s:${R(6, 13)}px;--t:${R(2, 4.5)}s;--d:${-R(0, 4)}s"></i>`);
    case 'uranus': return '<i class="frost"></i>' + many(55, () => `<i class="snow" style="left:${R(0, 100)}%;--s:${R(2, 4.5)}px;--t:${R(5, 9)}s;--d:${-R(0, 9)}s;--dx:${R(-30, 30)}px"></i>`);
    case 'neptune': return '<i class="tint" style="background:rgb(90 130 230 / .1)"></i>' +
      many(24, () => `<i class="streak" style="top:${R(3, 95)}%;--l:${R(40, 110)}px;--t:${R(.7, 1.5)}s;--d:${-R(0, 1.5)}s"></i>`);
    case 'pluto': return '<i class="tint" style="background:rgb(150 180 255 / .1)"></i>' +
      many(30, () => `<i class="snow big" style="left:${R(0, 100)}%;--s:${R(4, 8)}px;--t:${R(8, 14)}s;--d:${-R(0, 14)}s;--dx:${R(-40, 40)}px"></i>`);
  }
  return '';
}
const banner = (title, top) => `<svg class="banner" viewBox="0 0 300 70" style="left:6%;width:88%;top:${top}%" aria-hidden="true">
  <path d="M14 22 H44 V60 H14 L26 41 Z M286 22 H256 V60 H286 L274 41 Z" fill="var(--banner)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
  <rect x="34" y="10" width="232" height="44" rx="10" fill="var(--gold-pale)" stroke="var(--ink)" stroke-width="4.5"/>
  <text x="150" y="40" text-anchor="middle" style="font-size:${title.length > 19 ? 19 : 22}px">${title}</text></svg>`;

// прилёт: планета, её климат и факт — потом стоянка
function showArrival(i, then) {
  const [id, , , acc] = STOPS[i], c = CLIMATE[id], final = i >= FINAL;
  const title = final ? 'Долетели до Плутона!' : `Прилетели на ${acc}!`;
  scene.innerHTML = `<div class="stage">
    <div class="abs" style="inset:0;background:rgb(12 15 30 / .35)"></div>
    <div class="rays" style="left:50%;top:27%;width:150%"></div>
    <img class="abs sticker" src="${IMG}${id}.webp" alt="" style="width:${c.sticker ? 52 : 56}%;left:${c.sticker ? 12 : 22}%;top:12%">
    ${c.sticker ? `<img class="abs sticker" src="${IMG}${c.sticker}.webp" alt="" style="width:32%;left:60%;top:21%;z-index:2">` : ''}
    <div class="wx" aria-hidden="true">${weather(id)}</div>
    ${banner(title, 41)}
    <div class="factcard" style="top:54%"><div class="q">Климат · ${STOPS[i][1]}</div>${c.fact}</div></div>
    ${final ? `<div class="foot" style="bottom:calc(84px + env(safe-area-inset-bottom))"><div class="chips">
      <span class="chip">${fmt(S.track.length)} ${daysWord(S.track.length)} в пути</span>
      <span class="chip">${fmt(S.track.reduce((a, d) => a + G.counted(d.day), 0))} шагов</span>
      <span class="chip">двигатель: ${S.engine ? ENGINES[S.engine - 1] : 'встроенный'}</span></div></div>` : ''}
    <div class="foot"><button type="button" class="cta" id="sc-go">${final ? 'К карте' : 'На стоянку: что улучшим?'}</button></div>`;
  scene.hidden = false;
  scene.querySelector('#sc-go').addEventListener('click', () => { scene.hidden = true; then(); });
}

// старт: кто летит и как — одному сразу или экипажем с друзьями (или по коду друга)
function showStart() {
  let hero = save.hero in HEROES ? save.hero : 'panda', how = 'solo';
  const paint = () => {
    const crew = how === 'crew';
    scene.innerHTML = `<div class="stage">
      <img class="abs sticker" src="${IMG}earth.webp" alt="" style="width:150%;left:-25%;top:44%">
      <div class="abs" style="left:19%;width:62%;top:19%">
        <img class="sticker" src="${IMG}launchpad.webp" alt="" style="width:100%">
        <div class="abs" style="left:40%;bottom:39%;transform:translateX(-50%)">${rig({ seats: crew ? 3 : 1, crew: [hero], w: crew ? 92 : 74, flame: 0 })}</div></div>
      <div class="title" style="top:3%">Полёт к Плутону<small>Шаги превращаются в путь корабля</small></div></div>
      <div class="sheet on">
        <div class="q">Кто полетит</div>
        <div class="heroes" role="radiogroup" aria-label="Герой">${Object.entries(HEROES).map(([k, n]) =>
          `<button type="button" role="radio" data-h="${k}" aria-checked="${k === hero}"><img src="${IMG}hero_${k}.webp" alt="">${n}</button>`).join('')}</div>
        <div class="q">Как полетим</div>
        <div class="opts" role="radiogroup">
          <button type="button" class="opt" role="radio" data-how="solo" aria-checked="${!crew}"><div class="ic">${rig({ seats: 1, crew: [hero], w: 34, flame: 0 })}</div>
            <b>Лечу один</b><span class="price">${fmt(RULES.soloBuild)} шагов</span><span>лёгкий: шаг уводит вдвое дальше</span></button>
          <button type="button" class="opt" role="radio" data-how="crew" aria-checked="${crew}"${CREW_READY ? '' : ' aria-disabled="true"'}><div class="ic">${rig({ seats: 3, crew: [hero], w: 44, flame: 0 })}</div>
            <b>Собираю команду</b><span class="price">${fmt(RULES.crewBuild)} на троих</span><span>${CREW_READY ? 'шаги друзей складываются' : 'в демо недоступно'}</span></button></div>
        <button type="button" class="cta" id="sc-go">${crew ? 'Строить корабль на троих' : 'Строить одноместный'}</button>
        ${CREW_READY ? '<button type="button" class="link" id="sc-code">У меня есть код друга</button>' : ''}</div>`;
    scene.querySelectorAll('.heroes button').forEach(b => b.addEventListener('click', () => {
      const x = scene.querySelector('.heroes').scrollLeft;
      hero = b.dataset.h; paint(); scene.querySelector('.heroes').scrollLeft = x;
    }));
    scene.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
      if (b.getAttribute('aria-disabled') === 'true') return;
      const x = scene.querySelector('.heroes').scrollLeft;
      how = b.dataset.how; paint(); scene.querySelector('.heroes').scrollLeft = x;
    }));
    const code = scene.querySelector('#sc-code');
    if (code) code.addEventListener('click', () => { save.hero = hero; persist(); joinByCode(false); });
    scene.querySelector('#sc-go').addEventListener('click', () => {
      save.hero = hero; persist();
      if (how === 'crew') { crewProfile('ship'); return; }
      save.seed = save.seed || newSeed();
      save.start = DEMO ? shift(today(), -25) : today();
      save.snap = null; save.choices = { 0: 'solo' }; save.hooks = {}; save.steps = {}; save.seen = { u: 0, stop: 0, gifts: {} };
      mergeSteps(phone);   // сегодняшние шаги уже идут в корабль — не ждать следующей загрузки
      persist();
      scene.hidden = true;
      refresh(true);
    });
  };
  paint();
  scene.hidden = false;
}

// наклейка с экрана прилёта переезжает на карту
function slap(i) {
  const el = souvs[i];
  render(shown, false);
  if (!el) return;
  el.hidden = false; el.classList.remove('slap'); void el.offsetWidth; el.classList.add('slap');
}

// ===== ХОД ИГРЫ =====
// После каждого пересчёта корабль долетает на экране от того места, где игрок
// видел его в прошлый раз, до нынешнего. Потом — что надо показать по очереди:
// открыть контейнер базы, прилёт с климатом, стоянка с выбором.
let busy = false, anim = 0;
function animateTo(target, done) {
  cancelAnimationFrame(anim);
  const from = shown, dist = target - from;
  if (dist <= 0 || matchMedia('(prefers-reduced-motion: reduce)').matches) { shown = target; render(shown, true); done(); return; }
  const ms = Math.max(900, Math.min(4500, dist * 1600)), t0 = performance.now();
  const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const step = now => {
    const k = Math.max(0, Math.min((now - t0) / ms, 1));   // кадр rAF может начаться чуть раньше t0
    shown = from + dist * ease(k);
    drawShipIfChanged(); render(shown, true);
    if (k < 1) anim = requestAnimationFrame(step); else { shown = target; done(); }
  };
  anim = requestAnimationFrame(step);
}
// перерисовать корабль, когда он сел или взлетел и когда сменился этап стройки
let lastLanded = null;
function drawShipIfChanged() { const l = !where(shown) + ':' + buildStage(shown); if (l !== lastLanded) { lastLanded = l; drawShip(shown); } }

function next() {
  // контейнер базы, который игрок ещё не открывал
  for (const [i, g] of Object.entries(S.gifts)) if (!G.seen.gifts[i]) { openBase(+i, g); return; }
  if (S.phase === 'finished' && G.seen.stop < FINAL) {
    G.seen.stop = FINAL; persist();
    bodies[FINAL].classList.add('arrived');
    showArrival(FINAL, () => {});
    return;
  }
  if (S.phase === 'stop' && S.stop > 0) {
    if (G.seen.stop < S.stop) {
      G.seen.stop = S.stop; persist();
      const el = bodies[S.stop]; el.classList.remove('arrived'); void el.offsetWidth; el.classList.add('arrived');
      setTimeout(() => showArrival(S.stop, () => { slap(S.stop); if (canPick() && !myVote(S.stop)) setTimeout(openStop, souvs[S.stop] ? 700 : 0); }), 900);
      return;
    }
    if (canPick() && !G.choices[S.stop] && !pendingUp && !myVote(S.stop)) openStop();
  }
}

function refresh(first) {
  compute();
  if (!S || (S.stop === 0 && S.phase === 'stop' && !G.choices[0])) { hud.hidden = true; crewBtn.hidden = true; showStart(); return; }
  if (first) { shown = Math.min(G.seen.u || 0, S.at); lastLanded = null; drawShipIfChanged(); render(shown, true); }
  paintHud();
  const fly = () => {
    busy = true;
    animateTo(S.at, () => {
      busy = false;
      lastLanded = null; drawShipIfChanged(); render(shown, false);
      G.seen.u = S.at; persist();
      next();
    });
  };
  // корабль достроен, а игрок ещё не видел взлёта — сначала старт по кнопке
  if (shown === 0 && S.at > 0) { showLaunch(fly); return; }
  fly();
}

// старт: корабль готов и стоит на площадке, полетит по кнопке
function showLaunch(then) {
  const big = S.seats > 1;
  scene.innerHTML = `<div class="stage">
    <img class="abs sticker" src="${IMG}earth.webp" alt="" style="width:150%;left:-25%;top:44%">
    <div class="abs" style="left:19%;width:62%;top:19%">
      <img class="sticker" src="${IMG}launchpad.webp" alt="" style="width:100%">
      <div class="abs" style="left:40%;bottom:39%;transform:translateX(-50%)">${rig({ ...looks(), boost: false, crew: G.crew, w: big ? 92 : 74, flame: 1 })}</div></div>
    <div class="title" style="top:3%">Корабль готов!<small>Шаги сложились в корабль — пора лететь</small></div></div>
    <div class="foot"><button type="button" class="cta" id="sc-go">Старт!</button></div>`;
  scene.hidden = false;
  scene.querySelector('#sc-go').addEventListener('click', () => { scene.hidden = true; then(); });
}

async function load(first) {
  const h = addBonus(await readSteps());
  phone = h;
  if (save.crew) await syncCrew(h);
  else { mergeSteps(h); persist(); }
  if (becomeSoloLater) { const snap = becomeSoloLater; becomeSoloLater = null; toast('Экипажа больше нет — летим одни'); becomeSolo(snap); return; }
  refresh(first);
}

// ===== ЗАПУСК =====
document.getElementById('back').addEventListener('click', () => { if (history.length > 1) history.back(); else location.href = 'index.html'; });
// демо: старт сдвигается на 3 дня раньше — шагов больше, корабль летит дальше
const demoBtn = document.getElementById('demo');
demoBtn.hidden = !DEMO;
demoBtn.addEventListener('click', () => { if (!save.start || save.crew || busy || !scene.hidden) return; save.start = shift(save.start, -3); load(false); });
// бета: +500 шагов к сегодняшним
const plusBtn = document.getElementById('plus');
plusBtn.hidden = !BETA;
if (DEMO) plusBtn.style.top = 'calc(106px + env(safe-area-inset-top))';
document.getElementById('plus-info').addEventListener('click', () => {
  if (busy || !scene.hidden) return;
  sheet.innerHTML = `${SHEET_TOP}
    <div class="head"><div><h4>+500 шагов — только в бете</h4><p>Кнопка для проверки игры: чтобы пролететь дальше, не выходя на улицу. В обычной версии её нет.</p></div></div>
    <div class="info"><span>Каждое нажатие прибавляет <b>500 шагов к сегодняшним</b>, нажимать можно сколько угодно.
      За день засчитывается не больше ${fmt(RULES.stepCap)} шагов на человека, остальное уходит в бак.</span></div>
    ${save.crew ? '<div class="info"><span>В экипаже эти шаги уходят на сервер как настоящие и складываются с шагами друзей.</span></div>' : ''}`;
  sheet.classList.add('on');
});
document.getElementById('plus-add').addEventListener('click', () => {
  if (!(save.start || save.crew) || busy || !scene.hidden) return;
  const t = today();
  save.bonus = save.bonus || {}; save.bonus[t] = (save.bonus[t] || 0) + 500; persist();
  toast('+500 шагов'); load(false);
});
const idle = () => !busy && scene.hidden && !sheet.classList.contains('on');
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && (save.start || save.crew) && idle()) load(false); });
// экипаж: друзья шагают и голосуют без нас — раз в минуту забираем корабль
setInterval(() => { if (save.crew && document.visibilityState === 'visible' && idle()) load(false); }, 60_000);
let rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (!S) return; build(); lastLanded = null; drawShipIfChanged(); render(shown, false); }, 150); });

try { TWINKLE = await (await fetch('game/space_dark.json')).json(); } catch (e) { /* без мерцания — просто звёзды фона */ }
build();
load(true);
</script>
</body>
